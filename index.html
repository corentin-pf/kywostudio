  <style>
    @font-face {
      font-family: "Anton";
      src: url("/assets/fonts/anton.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --bleu: #010dcd;
      --blanc: #ffffff;
      /* Le logo garde les proportions de la maquette (16:9) et remplit l'écran */
      --W: min(80vw, 142.22vh);
      --H: calc(var(--W) * 0.5625);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bleu);
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---- Les deux moitiés cliquables ---- */
    .panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      overflow: hidden;
      display: block;
      outline: none;
    }
    .panel--archi { left: 0; background: var(--bleu); }
    .panel--graphisme { right: 0; background: var(--blanc); }

    .panel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity .6s ease, transform 1.2s cubic-bezier(.2, .7, .2, 1);
    }
    .panel--archi img { object-position: 45% 50%; }
    /* On cadre le bas de l'image pour garder l'ordinateur dans l'herbe */
    .panel--graphisme img { object-position: 50% 100%; }

    .panel:hover img,
    .panel:focus-visible img {
      opacity: 1;
      transform: scale(1);
    }

    /* ---- Textes qui apparaissent au survol ---- */
    .legende {
      position: absolute;
      bottom: calc((100vh - var(--H)) / 2 + var(--H) * 0.05);
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: calc(var(--W) * 0.0265);
      line-height: 1.02;
      color: var(--blanc);
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,.55), 0 0 50px rgba(0,0,0,.35);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .5s ease .1s, transform .5s ease .1s;
      z-index: 1;
    }
    .panel--archi .legende { right: calc(var(--W) * 0.037); text-align: right; }
    .panel--graphisme .legende { left: calc(var(--W) * 0.033); }

    .panel:hover .legende,
    .panel:focus-visible .legende {
      opacity: 1;
      transform: none;
    }

    /* ---- Logo KYWO + signature, posé au-dessus des deux moitiés ---- */
    .logo {
      position: fixed;
      left: 50%;
      top: 50%;
      width: var(--W);
      height: var(--H);
      transform: translate(-50%, -50%);
      pointer-events: none; /* les clics passent aux moitiés en dessous */
      z-index: 2;
    }
    .logo .kywo,
    .logo .signature {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .logo .kywo {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: auto;
      cursor: grab;
    }
    .logo .kywo.en-main { cursor: grabbing; }
    /* La signature est décalée pour tomber sur le « WO », comme sur la maquette */
    .logo .signature {
      transform: translate(20.4%, 8.6%);
      overflow: visible;
    }

    .kywo-bloc {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    .kywo-bloc.retour {
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .stage-text {
      position: absolute;
      top: 0.5%;
      right: 5.5%;
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: calc(var(--W) * 0.022);
      white-space: nowrap;
      color: var(--bleu);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: right;
      pointer-events: none;
    }

    /* Quand la souris passe sur les lettres KYWO : main « attraper » */
    .panel { -webkit-user-drag: none; }
    body { touch-action: none; }


    /* ---- Signature (en commentaire — retirer /* */ pour la remettre) ----
    .trait {
      fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
    }
    .pret .trait { animation: ecrire var(--duree) var(--delai) var(--rythme, ease-in-out) forwards; }
    @keyframes ecrire { to { stroke-dashoffset: 0; } }
    ---- Fin signature ---- */

    /* ---- Téléphone / écran vertical : les moitiés s'empilent ---- */
    @media (max-aspect-ratio: 4/5) {
      :root { --W: 100vw; }
      .panel { width: 100%; height: 50%; left: 0; right: auto; }
      .panel--archi { top: 0; bottom: auto; }
      .panel--graphisme { top: auto; bottom: 0; }

      /* Pas de survol au doigt : photos et textes visibles d'emblée */
      .panel img { opacity: 1; transform: none; }
      .legende {
        opacity: 1;
        transform: none;
        font-size: 7vw;
        bottom: 4vw;
      }
      .legende { text-shadow: 0 1px 12px rgba(0, 0, 0, .35); }
      .panel--archi .legende { top: 5vw; bottom: auto; left: 5vw; right: auto; text-align: left; }
      .panel--graphisme .legende { left: 5vw; }
      .stage-text { font-size: 2.8vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel img, .legende { transition: opacity .3s ease; transform: none !important; }
      .trait { stroke-dashoffset: 0; animation: none !important; }
    }
  </style>

<body>
  <h1 class="visually-hidden">KYWO Studio — Corentin Pelloux Fagot, architecture d'intérieur et graphisme à Lyon</h1>

        <path class="trait" pathLength="1" stroke-width="26" style="--duree:.55s; --delai:2.58s; --rythme:cubic-bezier(.3,.1,.2,1)"

  <script>
    // SIGNATURE DÉSACTIVÉE — décommenter pour remettre :
    // (function () {
    //   const img = new Image();
    //   img.src = "/assets/accueil/signature.webp";
    //   const lancer = () => document.documentElement.classList.add("pret");
    //   img.decode().then(lancer, lancer);
    // })();

    (function () {
      const kywo = document.querySelector(".kywo");
      const kywoBloc = document.querySelector(".kywo-bloc");
      if (!kywo || !kywoBloc) return;
      let prise = null, dx = 0, dy = 0, rafId = null, wobbleT = 0;

      // Canvas caché pour tester l'opacité pixel par pixel
      let alphaCtx = null;
      function initCanvas() {
        const c = document.createElement("canvas");
        c.width = kywo.naturalWidth;
        c.height = kywo.naturalHeight;
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(kywo, 0, 0);
        alphaCtx = ctx;
      }
      if (kywo.complete) initCanvas();
      else kywo.addEventListener("load", initCanvas, { once: true });

      function estOpaque(clientX, clientY) {
        if (!alphaCtx) return true;
        const r = kywo.getBoundingClientRect();
        const ix = Math.round((clientX - r.left) / r.width  * kywo.naturalWidth);
        const iy = Math.round((clientY - r.top)  / r.height * kywo.naturalHeight);
        try { return alphaCtx.getImageData(ix, iy, 1, 1).data[3] > 10; }
        catch { return true; }
      }

      function boucle() {
        wobbleT += 0.12;
        const rot = Math.sin(wobbleT) * 1.8;
        kywoBloc.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
        rafId = requestAnimationFrame(boucle);
      }

      kywo.addEventListener("pointermove", (e) => {
        if (prise) { dx = e.clientX - prise.x; dy = e.clientY - prise.y; return; }
        // Curseur adaptatif : main sur les lettres, flèche sur le vide
        kywo.style.cursor = estOpaque(e.clientX, e.clientY) ? "grab" : "default";
      });

      kywo.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        if (!estOpaque(e.clientX, e.clientY)) return; // pixel transparent → laisse passer
        e.preventDefault();
        kywoBloc.classList.remove("retour");
        prise = { x: e.clientX - dx, y: e.clientY - dy };
        kywo.classList.add("en-main");
        kywo.setPointerCapture(e.pointerId);
        wobbleT = 0;
        if (rafId) cancelAnimationFrame(rafId);
        boucle();
      });

      const lacher = () => {
        if (!prise) return;
        prise = null;
        cancelAnimationFrame(rafId);
        rafId = null;
        dx = 0; dy = 0;
        kywo.classList.remove("en-main");
        kywoBloc.classList.add("retour");
        kywoBloc.style.transform = "";
        kywoBloc.addEventListener("transitionend", () => kywoBloc.classList.remove("retour"), { once: true });
      };

      kywo.addEventListener("pointerup", lacher);
      kywo.addEventListener("pointercancel", lacher);
      kywo.addEventListener("lostpointercapture", lacher);

      // Redirige les clics sur les zones transparentes vers le panneau en dessous
      kywo.addEventListener("click", (e) => {
        if (estOpaque(e.clientX, e.clientY)) return;
        kywo.style.pointerEvents = "none";
        const cible = document.elementFromPoint(e.clientX, e.clientY);
        kywo.style.pointerEvents = "auto";
        const lien = cible?.closest("a");
        if (lien?.href) window.location.href = lien.href;
      });
    })();
  </script>
