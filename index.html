  <style>
    @font-face {
      font-family: "Anton";
      src: url("/assets/fonts/anton.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --bleu: #010dcd;
      --blanc: #ffffff;
      /* Le logo garde les proportions de la maquette (16:9) et remplit l'écran */
      --W: min(80vw, 142.22vh);
      --H: calc(var(--W) * 0.5625);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bleu);
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---- Les deux moitiés cliquables ---- */
    .panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      overflow: hidden;
      display: block;
      outline: none;
    }
    .panel--archi { left: 0; background: var(--bleu); }
    .panel--graphisme { right: 0; background: var(--blanc); }

    .panel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .panel--archi img { object-position: 45% 50%; }
    /* On cadre le bas de l'image pour garder l'ordinateur dans l'herbe */
    .panel--graphisme img { object-position: 50% 100%; }

    /* ---- Textes sous le filtre ---- */
    .legende {
      position: absolute;
      bottom: calc((100vh - var(--H)) / 2 + var(--H) * 0.05);
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: calc(var(--W) * 0.0265);
      line-height: 1.02;
      color: var(--blanc);
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,.55), 0 0 50px rgba(0,0,0,.35);
    }

    /* Filtre coloré — div placé APRÈS la légende dans le DOM → toujours au-dessus */
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity .5s ease;
    }
    .panel--archi .overlay  { background: rgba(1, 13, 205, 0.72); }
    .panel--graphisme .overlay { background: rgba(255, 255, 255, 0.72); }

    .panel:hover .overlay,
    .panel:focus-visible .overlay,
    .panel.active .overlay {
      opacity: 0;
    }
    .panel--archi .legende { right: calc(var(--W) * 0.037); text-align: right; }
    .panel--graphisme .legende { left: calc(var(--W) * 0.033); }


    /* ---- Logo KYWO + signature, posé au-dessus des deux moitiés ---- */
    .logo {
      position: fixed;
      left: 50%;
      top: 50%;
      width: var(--W);
      height: var(--H);
      transform: translate(-50%, -50%);
      pointer-events: none; /* les clics passent aux moitiés en dessous */
      z-index: 2;
    }
    .logo .kywo,
    .logo .signature {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .logo .kywo {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    /* Zone de drag invisible centrée sur le logo */
    .drag-zone {
      position: fixed;
      left: 50%;
      top: 50%;
      width: var(--W);
      height: var(--H);
      transform: translate(-50%, -50%);
      pointer-events: auto;
      z-index: 3;
      cursor: grab;
    }
    .drag-zone.en-main { cursor: grabbing; }
    /* La signature est décalée pour tomber sur le « WO », comme sur la maquette */
    .logo .signature {
      transform: translate(20.4%, 8.6%);
      overflow: visible;
    }

    .kywo-bloc {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
      pointer-events: none;
    }
    .kywo-bloc.retour {
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }


    .stage-text {
      position: absolute;
      top: 0.5%;
      right: 5.5%;
      margin: 0;
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      font-size: calc(var(--W) * 0.022);
      white-space: nowrap;
      color: var(--bleu);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: right;
      pointer-events: none;
    }

    /* Quand la souris passe sur les lettres KYWO : main « attraper » */
    .panel { -webkit-user-drag: none; }
    body { touch-action: none; }


    /* ---- Signature (en commentaire — retirer /* */ pour la remettre) ----
    .trait {
      fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
    }
    .pret .trait { animation: ecrire var(--duree) var(--delai) var(--rythme, ease-in-out) forwards; }
    @keyframes ecrire { to { stroke-dashoffset: 0; } }
    ---- Fin signature ---- */

    /* ---- Téléphone : split horizontal, textes centrés ---- */
    @media (max-width: 767px) {
      :root { --W: 100vw; }

      /* Split haut / bas */
      .panel--archi {
        width: 100% !important; height: 50vh !important;
        top: 0 !important; bottom: auto !important;
        left: 0 !important; right: auto !important;
        display: flex; align-items: center; justify-content: center;
      }
      .panel--graphisme {
        width: 100% !important; height: 50vh !important;
        top: 50vh !important; bottom: 0 !important;
        left: 0 !important; right: auto !important;
        display: flex; align-items: center; justify-content: center;
      }

      /* Overlays désactivés au doigt */
      .overlay { display: none; }

      /* Textes centrés dans leur moitié */
      .legende {
        position: relative !important;
        top: auto !important; bottom: auto !important;
        left: auto !important; right: auto !important;
        text-align: center !important;
        font-size: 8vw !important;
        line-height: 1.1 !important;
        text-shadow: 0 2px 16px rgba(0,0,0,.6) !important;
      }

      .stage-text { font-size: 3vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel img, .legende { transition: opacity .3s ease; transform: none !important; }
      .trait { stroke-dashoffset: 0; animation: none !important; }
    }
  </style>
</head>
<body>
  <h1 class="visually-hidden">KYWO Studio — Corentin Pelloux Fagot, architecture d'intérieur et graphisme à Lyon</h1>

  <a class="panel panel--archi" href="/architecture/" aria-label="Architecture d'intérieur">

  <div class="drag-zone" aria-hidden="true"></div>

  <div class="logo" aria-hidden="true">
    <div class="kywo-bloc">
      <img class="kywo" src="/assets/accueil/kywo-studio.webp" alt="" draggable="false">
      <p class="stage-text">Recherche un stage pour Janvier 2027</p>
    </div>

    <!-- SIGNATURE DÉSACTIVÉE — retirer ces commentaires pour la remettre :
    <svg class="signature" viewBox="0 0 2000 1125">
      <mask id="masque-signature" maskUnits="userSpaceOnUse" x="0" y="0" width="2000" height="1125">

              d="M893 607 L1312 603"/>

        <path class="trait" pathLength="1" stroke-width="26" style="--duree:.55s; --delai:2.58s; --rythme:cubic-bezier(.3,.1,.2,1)"
              d="M880 653 L915 648 L1030 637 L1182 629 L1297 627 L1466 627"/>

      <image href="/assets/accueil/signature.webp" width="2000" height="1125" mask="url(#masque-signature)"/>

  <script>
    // SIGNATURE DÉSACTIVÉE — décommenter pour remettre :
    // (function () {
    //   const img = new Image();
    //   img.src = "/assets/accueil/signature.webp";
    //   const lancer = () => document.documentElement.classList.add("pret");
    //   img.decode().then(lancer, lancer);
    // })();

    (function () {
      const kywoBloc = document.querySelector(".kywo-bloc");
      const dragZone = document.querySelector(".drag-zone");
      const archiPanel = document.querySelector(".panel--archi");
      const graphPanel = document.querySelector(".panel--graphisme");
      if (!kywoBloc || !dragZone) return;
      let prise = null, dx = 0, dy = 0, rafId = null, wobbleT = 0;
      let hasDragged = false, clickX = 0;

      // Hover global : active le bon panel selon la position x de la souris
      document.addEventListener("pointermove", (e) => {
        const mid = window.innerWidth / 2;
        archiPanel.classList.toggle("active", e.clientX < mid);
        graphPanel.classList.toggle("active", e.clientX >= mid);
        if (prise) {
          dx = e.clientX - prise.x;
          dy = e.clientY - prise.y;
          if (Math.hypot(dx, dy) > 8) hasDragged = true;
        }
      });
      document.addEventListener("mouseleave", () => {
        archiPanel.classList.remove("active");
        graphPanel.classList.remove("active");
      });

      function boucle() {
        wobbleT += 0.12;
        const rot = Math.sin(wobbleT) * 1.8;
        kywoBloc.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
        rafId = requestAnimationFrame(boucle);
      }

      dragZone.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        kywoBloc.classList.remove("retour");
        prise = { x: e.clientX - dx, y: e.clientY - dy };
        clickX = e.clientX;
        hasDragged = false;
        dragZone.classList.add("en-main");
        dragZone.setPointerCapture(e.pointerId);
        wobbleT = 0;
        if (rafId) cancelAnimationFrame(rafId);
        boucle();
      });

      function reinitialiser() {
        if (!prise) return false;
        prise = null;
        cancelAnimationFrame(rafId);
        rafId = null;
        dx = 0; dy = 0;
        dragZone.classList.remove("en-main");
        kywoBloc.classList.add("retour");
        kywoBloc.style.transform = "";
        kywoBloc.addEventListener("transitionend", () => kywoBloc.classList.remove("retour"), { once: true });
        return true;
      }

      dragZone.addEventListener("pointerup", () => {
        const etaitEnPrise = !!prise;
        const etaitDrag = hasDragged;
        const savedClickX = clickX;
        reinitialiser();
        if (etaitEnPrise && !etaitDrag) {
          window.location.href = savedClickX < window.innerWidth / 2 ? "/architecture/" : "/graphisme/";
        }
      });

      dragZone.addEventListener("pointercancel", reinitialiser);
      dragZone.addEventListener("lostpointercapture", reinitialiser);
    })();
  </script>
