  <link rel="preload" href="/assets/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/archi/site.css">
</head>
<body>

  <header class="menu">
    <nav aria-label="Menu principal">
      <a class="souligne" href="/"><span><span class="fr-only">Accueil</span><span class="en-only">Home</span></span></a>
      <a class="souligne" href="/architecture/#projets"><span><span class="fr-only">Projets</span><span class="en-only">Projects</span></span></a>
      <a class="souligne" href="/architecture/#services"><span><span class="fr-only">Moi ?</span><span class="en-only">Me?</span></span></a>
      <a class="souligne" href="/architecture/#contact"><span>Contact</span></a>
      <a class="souligne menu__mobile" href="/"><span><span class="fr-only">Accueil</span><span class="en-only">Home</span></span></a>
      <a class="souligne menu__mobile" href="/architecture/#projets"><span><span class="fr-only">Projets</span><span class="en-only">Projects</span></span></a>
    </nav>
  </header>

  <div class="lang-selector" id="lang-selector">
    <button class="lang-flag" aria-label="Changer la langue / Switch language">🇫🇷</button>
    <div class="lang-popup">
      <div class="lang-popup__grille">
        <button class="lang-popup__touche" data-lang="fr">Hi,</button>
        <span class="lang-popup__touche lang-popup__touche--ou" aria-hidden="true"></span>
        <button class="lang-popup__touche" data-lang="en">↙</button>
        <button class="lang-popup__touche" data-lang="fr">FR</button>
        <span class="lang-popup__touche lang-popup__touche--ou" aria-hidden="true">or</span>
        <button class="lang-popup__touche" data-lang="en">ENG</button>
      </div>
    </div>
  </div>
  <main class="projet">
    <h1 class="visually-hidden">Parcours et compétences de Corentin Pelloux Fagot</h1>
    <img class="parcours__image" src="/assets/archi/parcours/parcours-competences.jpg" alt="Parcours et compétences de Corentin Pelloux Fagot : formation, expériences et logiciels maîtrisés">
  </main>

  <footer class="pied">
    <a class="pied__titre" href="/" aria-label="Retour à l'accueil KYWO Studio">
      <span class="pleine-largeur">!!! Kywo</span>
    </a>
    <div class="pied__infos">
      <p>©2026</p>
      <p>LYON FRANCE</p>
      <p data-horloge>00:00:00</p>
    </div>
    <p class="pied__legales"><a href="/mentions-legales/">Mentions légales</a></p>
  </footer>

  <div class="curseur" aria-hidden="true"></div>
  <script src="/assets/archi/site.js"></script>
  <script>
    (function () {
      const html = document.documentElement;
      const saved = localStorage.getItem("kywo-lang") || "fr";
      html.setAttribute("data-lang", saved);
      html.setAttribute("lang", saved);

      const selector = document.getElementById("lang-selector");
      if (!selector) return;
      const flag = selector.querySelector(".lang-flag");
      const popup = selector.querySelector(".lang-popup");
      const touchesFr = popup.querySelectorAll("[data-lang='fr']");
      const touchesEn = popup.querySelectorAll("[data-lang='en']");

      const accueilLink = document.querySelector(".menu nav a:first-child");
      function positionSelector() {
        if (!accueilLink) return;
        const lang = html.getAttribute("data-lang") || "fr";
        const span = accueilLink.querySelector(lang === "fr" ? ".fr-only" : ".en-only");
        const rect = (span || accueilLink).getBoundingClientRect();
        if (rect.right > 0) selector.style.left = (rect.right + 16) + "px";
      }

      function updateUI(lang) {
        flag.textContent = lang === "fr" ? "🇫🇷" : "🇬🇧";
        touchesFr.forEach(t => t.classList.toggle("lang-popup__touche--actif", lang === "fr"));
        touchesEn.forEach(t => t.classList.toggle("lang-popup__touche--actif", lang === "en"));
        requestAnimationFrame(positionSelector);
      }

      function setLang(lang) {
        html.setAttribute("data-lang", lang);
        html.setAttribute("lang", lang);
        localStorage.setItem("kywo-lang", lang);
        updateUI(lang);
      }

      updateUI(saved);

      let hideTimer;
      function openPopup() { clearTimeout(hideTimer); selector.classList.add("ouvert"); }
      function startClose() { hideTimer = setTimeout(() => selector.classList.remove("ouvert"), 500); }

      flag.addEventListener("mouseenter", openPopup);
      flag.addEventListener("mouseleave", startClose);
      popup.addEventListener("mouseenter", openPopup);
      popup.addEventListener("mouseleave", startClose);

      popup.querySelectorAll("button[data-lang]").forEach(btn => {
        btn.addEventListener("click", e => { e.stopPropagation(); setLang(btn.dataset.lang); });
      });

      document.addEventListener("click", e => {
        if (!selector.contains(e.target)) selector.classList.remove("ouvert");
      });

      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        requestAnimationFrame(positionSelector);
      });
      window.addEventListener("resize", positionSelector);

      const menu = document.querySelector(".menu");
      if (menu) {
        new MutationObserver(() => {
          selector.style.transform = menu.classList.contains("menu--cache") ? "translateY(-200%)" : "";
        }).observe(menu, { attributes: true, attributeFilter: ["class"] });
      }
    })();
  </script>
</body>
</html>
