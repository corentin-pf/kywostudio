<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | KYWO Studio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#010dcd">
  <link rel="icon" href="/assets/accueil/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Anton"; src: url("/assets/fonts/anton.woff2") format("woff2"); font-display: swap; }
    :root { --bleu: #010dcd; --blanc: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bleu); color: var(--blanc); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px;
      font-family: "Anton", Impact, sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-weight: 400; font-size: clamp(120px, 30vw, 420px); line-height: .85; }
    p { margin: 0; font-size: clamp(22px, 3vw, 36px); line-height: 1.1; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a {
      padding: 12px 24px;
      border: 1px solid var(--blanc);
      border-radius: 100px;
      color: var(--blanc);
      font-size: clamp(16px, 1.6vw, 20px);
      text-decoration: none;
      transition: background .3s ease, color .3s ease;
    }
    a:hover, a:focus-visible { background: var(--blanc); color: var(--bleu); }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Cette page n'existe pas (ou plus).</p>
  <nav aria-label="Liens utiles">
    <a href="/">Accueil</a>
    <a href="/architecture/">Architecture d'intérieur</a>
    <a href="/graphisme/">Graphisme</a>
  </nav>
</body>
</html>
