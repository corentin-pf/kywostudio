<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objectif Brevet</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brevet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/revisions-laureline-brevet/manifest.json">
<link rel="icon" href="/revisions-laureline-brevet/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/revisions-laureline-brevet/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : pensé d'abord pour le téléphone. Cartes aux coins arrondis façon fenêtres macOS/iOS, filets noirs nets,
   barre d'onglets en bas sur mobile. Le noir et blanc porte tout ; la couleur ne sert qu'à repérer la matière. */
:root{
  --bg:#ffffff; --fg:#0b0b0c; --mute:#6b6b72; --soft:#f2f2f5; --hair:#e2e2e7; --raise:#ffffff;
  --on:#ffffff; --on-dim:rgba(255,255,255,.32);
  --fr:#E5302A; --ma:#0A5BD8; --hg:#C26300; --svt:#178A3E; --pc:#8A3FCB; --te:#00808A;
  --ok:#178A3E; --ko:#E5302A;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px;
  --bw:1.5px;
  --hh:68px;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sub:var(--fg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --fg:#f5f5f7; --mute:#9b9ba3; --soft:#1a1a1d; --hair:#2c2c31; --raise:#141416; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#000000; --fg:#f5f5f7; --mute:#9b9ba3; --soft:#1a1a1d; --hair:#2c2c31; --raise:#141416; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sub);outline-offset:2px;border-radius:var(--r-xs)}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mute{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:var(--bw) solid var(--fg)}
.top-in{display:flex;align-items:center;gap:24px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.03em;white-space:nowrap}
.logo-dots{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.logo-dots i{width:7px;height:7px;display:block;border-radius:2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;white-space:nowrap;border-radius:999px}
.nav a.on{background:var(--fg);color:var(--bg)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);height:6px}
.strip a{display:block}

.tabbar{display:none}

/* ---------- Typo & sections ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lead{font-size:19px;line-height:1.45;max-width:58ch;color:var(--mute)}
.sec{padding-block:44px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:18px}
.sec-h h2{font-size:28px;font-weight:800}
.sec-h span{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);padding:11px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border-radius:var(--r-sm);transition:transform .12s, background .12s}
.btn:active{transform:scale(.97)}
.btn-fill{background:var(--fg);color:var(--bg)}
.btn-sub{background:var(--sub);border-color:var(--sub);color:var(--on)}
.link{background:none;border:0;padding:8px 0;font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1fr 300px;gap:32px;padding-block:56px 8px;align-items:end}
.hero h1{font-size:clamp(2.3rem,6.4vw,5rem);font-weight:800;line-height:.95;letter-spacing:-.045em;margin:14px 0 18px}
.hero .row{margin-top:26px}
.count{border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:4px}
.count-n{font-size:96px;font-weight:800;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.count-l{font-weight:700;font-size:17px}
.count-s{font-size:13px;color:var(--mute)}
.count-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:14px}
.count-bar i{height:8px;display:block;border-radius:4px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;min-height:230px;padding:20px;border-radius:var(--r-lg);background:var(--sub);color:var(--on);text-decoration:none;transition:transform .16s}
.tile:active{transform:scale(.98)}
.tile-code{font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:.8}
.tile-name{margin-top:auto;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile-meta{font-size:13px;opacity:.9;margin-top:4px}
.tile-arrow{position:absolute;top:18px;right:20px;font-size:24px;font-weight:700}
.bar{display:block;height:6px;background:var(--on-dim);margin-top:14px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on);border-radius:3px}

.today{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-height:190px;transition:background .12s}
.tcard b{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tcard h3{font-size:19px;font-weight:800}
.tcard p{font-size:14px;color:var(--mute)}
.tcard .go{margin-top:auto;font-weight:700;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden;margin-top:40px}
.stat{padding:18px 20px;border-right:var(--bw) solid var(--fg)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:40px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--mute)}

/* ---------- Matière ---------- */
.band{width:min(1148px, calc(100% - 2 * max(16px, env(safe-area-inset-left,0px))));margin:20px auto 0;border-radius:var(--r-lg);background:var(--sub);color:var(--on)}
.band .wrap{padding-left:28px;padding-right:28px}
.band-in{padding-block:30px 28px}
.band h1{font-size:clamp(2.4rem,7vw,5.2rem);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:16px 0 12px}
.band p{font-size:18px;max-width:58ch;opacity:.92}
.band-meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.band-meta span{border:var(--bw) solid var(--on);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.band .btn{background:var(--on);color:#0b0b0c;border-color:var(--on)}
.band .btn.ghost{background:transparent;color:var(--on)}
.crumb{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700}
.crumb a{text-decoration:none;opacity:.85}
.crumb span{opacity:.5}

.chaps{list-style:none;margin:0;padding:0;border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden}
.chaps li + li .chap-row{border-top:1px solid var(--hair)}
.chap-row{display:grid;grid-template-columns:64px 1fr 120px 24px;gap:16px;align-items:center;padding:18px 18px;text-decoration:none;transition:background .12s}
.chap-row .num{font-size:38px;font-weight:800;letter-spacing:-.05em;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1}
.chap-row .ct{min-width:0;display:flex;flex-direction:column;gap:3px}
.chap-row .ct b{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.chap-row .sum{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap-row .arrow{font-size:20px;font-weight:700;color:var(--mute)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.mini{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .track{height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.mini .track i{display:block;height:100%;background:var(--sub);border-radius:3px}

/* ---------- Chapitre ---------- */
.chead .crumb{padding-top:24px;color:var(--mute)}
.chead-row{display:flex;gap:20px;align-items:flex-end;margin:16px 0 18px}
.chead-n{flex:none;width:100px;height:100px;border-radius:var(--r-lg);background:var(--sub);color:var(--on);display:grid;place-items:center;font-size:50px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.chead-t{min-width:0}
.chead h1{font-size:clamp(1.8rem,5vw,3.6rem);font-weight:800;line-height:1.02;letter-spacing:-.04em;margin-top:6px}
.chead-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--mute);padding-bottom:16px}
.chead-meta b{color:var(--fg)}

.tabs-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--hair)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:var(--r-sm);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--sub);color:var(--on);box-shadow:var(--shadow)}
.tab small{font-weight:600;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.t-short{display:none}
.deck-top > span:first-child{white-space:nowrap}

.panel{padding-block:30px 16px;min-height:340px}
.ph{font-size:28px;font-weight:800;margin-bottom:16px}

.resume ol{list-style:none;margin:0;padding:0}
.resume li{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--hair);align-items:start}
.resume li:first-child{border-top:2px solid var(--fg)}
.rn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--sub);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:18px}
.resume li p{font-size:clamp(1.08rem,2.3vw,1.45rem);line-height:1.38;font-weight:500;max-width:52ch}
.resume li p b{font-weight:800}
.next-steps{margin-top:24px}

.cours{display:grid;grid-template-columns:220px 1fr;gap:48px}
.toc{position:sticky;top:calc(var(--hh) + 90px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none;color:var(--mute);border-radius:var(--r-xs)}
.cbody{min-width:0;display:flex;flex-direction:column;gap:36px}
.cs h3{font-size:24px;font-weight:800;padding-bottom:10px;border-bottom:2px solid var(--fg);margin-bottom:14px;scroll-margin-top:calc(var(--hh) + 90px)}
.cs p{font-size:17px;line-height:1.6;max-width:68ch}
.sq{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px;max-width:70ch}
.sq li{position:relative;padding-left:22px;font-size:17px;line-height:1.55}
.sq li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:3px;background:var(--sub)}
.key{margin-top:18px;border:var(--bw) solid var(--sub);border-radius:var(--r);overflow:hidden;max-width:70ch}
.key span{display:block;background:var(--sub);color:var(--on);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px}
.key p{padding:12px 16px 14px;font-size:16px;font-weight:600}
.code{margin:12px 0 0;padding:16px 18px;background:var(--soft);border-radius:var(--r-sm);font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;white-space:pre}

/* ---------- Schémas ---------- */
.dgs{display:flex;flex-direction:column;gap:22px}
.dg{margin:0;border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:22px}
.dg-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.dg-h::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--sub);flex:none}
.dg-cap{font-size:13px;color:var(--mute);margin-top:14px;max-width:70ch}
.dg-svg svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.dg-svg svg text{fill:var(--fg);font:600 14px var(--font)}
.dg-svg .s{fill:none;stroke:var(--fg);stroke-width:2}
.dg-svg .as{fill:none;stroke:var(--sub);stroke-width:3.5}
.dg-svg .a{fill:var(--sub)}
.dg-svg .ink{fill:var(--fg)}
.dg-svg .bgf{fill:var(--bg)}
.dg-svg .grid line{stroke:var(--hair);stroke-width:1}
.dg-svg .nd{fill:var(--bg);stroke:var(--sub);stroke-width:2.5;rx:12px}
.dg-svg text.w{fill:var(--on)}
.dg-svg text.m{fill:var(--mute)}
.dg-svg text.at{fill:var(--sub);font-weight:800}
.dg-svg text.sm{font-size:12px}
.dg-svg text.lg{font-size:15px;font-weight:800}
.dg-svg rect.a{rx:10px}

.flow-wrap{overflow-x:auto;padding-bottom:4px}
.flow{list-style:none;margin:0;padding:0;display:flex;gap:30px;min-width:min-content}
.flow li{position:relative;flex:1 1 0;min-width:140px;border:var(--bw) solid var(--fg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-25px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;color:var(--sub)}
.flow-n{width:26px;height:26px;border-radius:8px;background:var(--sub);color:var(--on);display:grid;place-items:center;font-size:13px;font-weight:800}
.flow b{font-size:16px;font-weight:800;line-height:1.2}
.flow span{font-size:13px;color:var(--mute);line-height:1.4}

.tl{list-style:none;margin:0;padding:0 0 0 4px;border-left:3px solid var(--sub)}
.tl li{position:relative;display:grid;grid-template-columns:130px 1fr;gap:16px;padding:10px 0 10px 22px}
.tl li::before{content:"";position:absolute;left:-10px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--sub);border:3px solid var(--bg)}
.tl-d{font-weight:800;font-variant-numeric:tabular-nums}
.tl-t{display:flex;flex-direction:column;min-width:0}
.tl-t b{font-weight:700}
.tl-t span{font-size:14px;color:var(--mute)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden}
.dcell{background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:6px}
.dcell b{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:pre-wrap}
.dcell span{font-size:14px;line-height:1.45}
.dcell em{font-style:normal;font-size:13px;color:var(--sub);font-weight:700}

.tree{display:flex;flex-direction:column;align-items:center}
.tree-root{background:var(--sub);color:var(--on);padding:12px 22px;border-radius:var(--r-sm);font-weight:800;font-size:18px;position:relative;text-align:center}
.tree-root::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:20px;background:var(--fg)}
.tree-kids{margin-top:20px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;border-top:2px solid var(--fg);padding-top:18px}
.tree-kid{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.tree-kid::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--sub)}
.tree-kid b{font-size:17px;font-weight:800;margin-top:2px}
.tree-kid > span{font-size:14px;color:var(--mute)}
.tree-kid ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tree-kid li{font-size:14px;background:var(--soft);border-radius:var(--r-xs);padding:7px 10px;font-weight:600}

/* ---------- Flashcards ---------- */
.deck{max-width:640px;margin:0 auto}
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mute);min-width:0}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sub);flex:none}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{position:relative;display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;perspective:1400px;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .25s ease}
.fc-in{position:relative;display:block;height:340px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.is-flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:26px;border:2px solid var(--fg);border-radius:var(--r-lg);background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.fc-back{transform:rotateY(180deg);background:var(--sub);border-color:var(--sub);color:var(--on)}
.fc-k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.fc-t{font-size:clamp(1.35rem,5.4vw,2.1rem);font-weight:800;line-height:1.2;letter-spacing:-.02em}
.fc-hint{font-size:13px;color:var(--mute);font-weight:600}
.fc-st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.fc::after{position:absolute;top:18px;z-index:2;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--on);pointer-events:none}
.fc[data-sw="yes"]::after{content:"Je sais ✓";right:18px;background:var(--ok)}
.fc[data-sw="no"]::after{content:"À revoir";left:18px;background:var(--ko)}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.deck-actions .btn{min-height:54px;font-size:16px;border-radius:var(--r)}
.deck-foot{display:flex;justify-content:space-between;margin-top:6px}
.kbd{text-align:center;font-size:13px;color:var(--mute);margin-top:16px;padding-inline:8px}
.done,.empty{border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.done-n{font-size:80px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- Quiz ---------- */
.quiz{max-width:720px;margin:0 auto}
.qz-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.qz-bar{height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin:10px 0 20px}

.opt.is-right{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.is-wrong{background:var(--ko);border-color:var(--ko);color:var(--on)}
.opt.is-dim{opacity:.4}

.qz-fb.ok b{color:var(--ok)}
.qz-fb.ko b{color:var(--ko)}
.qz-fb .btn{margin-top:6px}

/* ---------- En-têtes de page, filtres ---------- */

<script>
window.BREVET = {}; var BREVET = window.BREVET; var BREVET_EXTRA = {}; var BREVET_COURS = {};
BREVET.fr = [
{
  id: "fr-phrase", tag: "Grammaire", title: "La phrase complexe",
  resume: [
    "Une phrase simple contient <b>un seul verbe conjugué</b>. Une phrase complexe en contient plusieurs : elle est formée de plusieurs <b>propositions</b>.",
    "Les propositions sont reliées par <b>juxtaposition</b> (ponctuation), <b>coordination</b> (mais, ou, et, donc, or, ni, car) ou <b>subordination</b>.",
    "Trois subordonnées à connaître : la <b>relative</b>, la <b>conjonctive complétive</b> et la <b>circonstancielle</b>.",
    "Pour identifier une proposition, on donne sa <b>nature</b> (relative, complétive…) et sa <b>fonction</b> (complément de l’antécédent, COD, complément circonstanciel)."
  ],
  cours: [
    { h: "Repérer les propositions", p: "Compte les verbes conjugués : autant de verbes conjugués, autant de propositions. La proposition <b>principale</b> ne dépend d’aucune autre. La <b>subordonnée</b> dépend toujours d’une principale et ne peut pas exister seule.", k: "Encadre chaque verbe conjugué, puis cherche où commence et où s’arrête sa proposition." },
    { h: "Juxtaposition et coordination", p: "Les propositions juxtaposées sont séparées par une virgule, un point-virgule ou deux-points. Les propositions coordonnées sont reliées par une conjonction de coordination ou un adverbe de liaison (puis, ensuite, pourtant).", l: ["« Il pleut ; nous restons à la maison. » → propositions juxtaposées.", "« Il pleut, donc nous restons à la maison. » → propositions coordonnées."] },
    { h: "Les trois subordonnées", l: [
      "<b>Relative</b> : introduite par un pronom relatif (qui, que, quoi, dont, où, lequel). Elle complète un nom, appelé <b>antécédent</b>. « Le livre <u>que tu m’as prêté</u> est génial. »",

      "<b>Circonstancielle</b> : introduite par une conjonction de subordination (quand, parce que, bien que, si, pour que, si bien que…). Elle exprime le temps, la cause, la conséquence, le but, la concession ou la condition."
    ] },
    { h: "Au brevet", p: "On te demande souvent d’identifier la nature ou la fonction d’une proposition, ou de réunir deux phrases simples en une phrase complexe. Justifie toujours ta réponse en citant le mot qui introduit la proposition.", k: "Relative = il y a un antécédent. Complétive = pas d’antécédent, elle répond à « quoi ? » après le verbe." }
  ],
  schema: [
    { type: "tree", title: "Relier des propositions", root: "Phrase complexe", kids: [

  quiz: [
    ["« Je sais <u>que tu as raison</u>. » La proposition soulignée est…", ["une subordonnée conjonctive complétive", "une subordonnée relative", "une proposition coordonnée", "une subordonnée circonstancielle de cause"], "« Que » introduit ici le COD du verbe « savoir ». Il n’y a pas d’antécédent : ce n’est pas une relative."],

  ]
},
{

    { h: "Les causes et le début de la guerre",
      p: ["Au début du XXe siècle, l’Europe domine le monde mais elle est divisée par des rivalités : rivalités coloniales et économiques, nationalismes (la France veut récupérer l’Alsace-Moselle perdue en 1871), course aux armements. Deux systèmes d’alliances s’opposent : la <b>Triple-Entente</b> (France, Royaume-Uni, Russie) et la <b>Triple-Alliance</b> (Allemagne, Autriche-Hongrie, Italie).",

      p: ["Le théorème de Thalès concerne deux droites qui se coupent en un point A, et deux autres droites <b>parallèles</b> qui les traversent. On obtient deux triangles : un « petit » triangle AMN et un « grand » triangle ABC.",
          "Dans la configuration <b>emboîtée</b>, M est sur le segment [AB] et N sur [AC] : le petit triangle est à l’intérieur du grand. Dans la configuration <b>papillon</b>, les points M et N sont de l’autre côté de A : les deux triangles sont opposés par le sommet A."],
      dg: [
        { type: "svg", title: "Configuration emboîtée", svg: `<svg viewBox="0 0 420 290" role="img" aria-label="Triangle ABC avec MN parallèle à BC"><path class="s" d="M200 30 L60 260 L360 260 Z"/><line class="as" x1="130" y1="145" x2="280" y2="145"/><circle class="a" cx="130" cy="145" r="5"/><circle class="a" cx="280" cy="145" r="5"/><text x="200" y="22" text-anchor="middle">A</text><text x="42" y="280">B</text><text x="364" y="280">C</text><text x="118" y="142" text-anchor="end">M</text><text x="292" y="142">N</text><text x="205" y="174" text-anchor="middle" class="at">(MN) // (BC)</text></svg>` },
        { type: "svg", title: "Configuration papillon", svg: `<svg viewBox="0 0 420 280" role="img" aria-label="Configuration papillon de Thalès"><line class="s" x1="60" y1="40" x2="340" y2="240"/><line class="s" x1="60" y1="240" x2="340" y2="40"/><line class="as" x1="60" y1="40" x2="60" y2="240"/><line class="as" x1="290" y1="76" x2="290" y2="204"/><circle class="ink" cx="200" cy="140" r="4"/><text x="200" y="128" text-anchor="middle">A</text><text x="44" y="36">B</text><text x="44" y="258">C</text><text x="300" y="72">N</text><text x="300" y="220">M</text><text x="300" y="150" class="at sm">(MN) // (BC)</text></svg>`, cap: "Les deux triangles AMN et ABC sont « tête-bêche ». Les égalités de Thalès sont les mêmes." }
      ] },
    { h: "Le théorème",
      p: ["<b>Énoncé</b> : soient deux droites (BM) et (CN) sécantes en A. Si les droites (MN) et (BC) sont <b>parallèles</b>, alors <b>AM/AB = AN/AC = MN/BC</b>.",
          "Astuce pour ne pas se tromper : on écrit en haut les côtés du <b>petit</b> triangle AMN et en bas les côtés <b>correspondants</b> du grand triangle ABC, dans le même ordre. Les côtés correspondants sont ceux qui sont sur la même droite (AM et AB), ou parallèles (MN et BC)."],
      tab: { h: ["Petit triangle AMN", "Grand triangle ABC", "Pourquoi ils correspondent"], r: [["AM", "AB", "même droite (AB)"], ["AN", "AC", "même droite (AC)"], ["MN", "BC", "droites parallèles"]] } },
    { h: "Calculer une longueur",
      p: ["On écrit les trois rapports, on remplace par les longueurs connues, puis on garde l’égalité de deux rapports qui contient une seule inconnue. On termine par un <b>produit en croix</b> : si a/b = c/d, alors a × d = b × c."],
      ex: { q: "Les points A, M, B sont alignés, ainsi que A, N, C, et (MN) // (BC). AM = 3 cm, AB = 7,5 cm, AN = 4 cm, BC = 10 cm. Calculer AC et MN.", s: ["Les droites (BM) et (CN) sont sécantes en A et (MN) // (BC). D’après le théorème de Thalès : AM/AB = AN/AC = MN/BC.", "On remplace : 3/7,5 = 4/AC = MN/10.", "Calcul de AC : 3/7,5 = 4/AC, donc AC = 7,5 × 4 ÷ 3 = 10 cm.", "Calcul de MN : 3/7,5 = MN/10, donc MN = 3 × 10 ÷ 7,5 = 4 cm."] },
      warn: "Le théorème ne s’applique que si les droites sont parallèles. Vérifie que l’énoncé le dit, ou démontre-le avant (deux droites perpendiculaires à une même troisième sont parallèles)." },
    { h: "La réciproque : prouver un parallélisme",
      p: ["<b>Énoncé</b> : si les points A, M, B d’une part et A, N, C d’autre part sont <b>alignés dans le même ordre</b>, et si AM/AB = AN/AC, alors les droites (MN) et (BC) sont parallèles.",
          "On calcule les deux rapports <b>séparément</b> (souvent en écriture décimale ou en simplifiant les fractions) puis on compare. Si les rapports sont différents, la contraposée permet de conclure que les droites ne sont pas parallèles."],
      ex: { q: "AM = 2,4 ; AB = 6 ; AN = 3 ; AC = 7,5. Les points sont alignés dans le même ordre. (MN) et (BC) sont-elles parallèles ?", s: ["D’une part AM/AB = 2,4 ÷ 6 = 0,4.", "D’autre part AN/AC = 3 ÷ 7,5 = 0,4.", "Les rapports sont égaux et les points sont alignés dans le même ordre.", "D’après la réciproque du théorème de Thalès, (MN) // (BC)."] },
      warn: "Pour la réciproque, on n’utilise que AM/AB et AN/AC, jamais MN/BC : on ne sait pas encore si les droites sont parallèles." },
    { h: "Agrandissement et réduction",
      p: ["Quand on agrandit ou réduit une figure, toutes les longueurs sont multipliées par un même nombre k appelé <b>rapport</b> (ou coefficient). Si k > 1, c’est un agrandissement ; si 0 < k < 1, c’est une réduction. Dans la configuration de Thalès, le triangle AMN est une réduction de ABC de rapport AM/AB.",
          "Les angles ne changent pas. En revanche, les aires sont multipliées par <b>k²</b> et les volumes par <b>k³</b>."],
      tab: { h: ["Grandeur", "Multipliée par", "Exemple avec k = 3"], r: [["Longueur", "k", "2 cm → 6 cm"], ["Aire", "k²", "5 cm² → 45 cm²"], ["Volume", "k³", "2 cm³ → 54 cm³"], ["Angle", "inchangé", "40° → 40°"]] },
      ex: { q: "Une pyramide a un volume de 540 cm³. On la coupe par un plan parallèle à la base, au tiers de la hauteur depuis le sommet. Volume de la petite pyramide ?", s: ["La petite pyramide est une réduction de la grande de rapport k = 1/3.", "Les volumes sont multipliés par k³ = (1/3)³ = 1/27.", "Volume = 540 × 1/27 = 20 cm³."] },
      k: "Longueur × k, aire × k², volume × k³ : c’est l’une des questions les plus fréquentes au brevet." }
  ]
};

    { h: "Calculer une longueur",

BREVET_COURS["ma-transformations"] = {
  cours: [
    { h: "Qu’est-ce qu’une transformation ?",

          "Au programme de 3e, cinq transformations : la symétrie axiale, la symétrie centrale, la translation, la rotation et l’homothétie. Les quatre premières déplacent la figure sans la déformer ; l’homothétie peut l’agrandir ou la réduire."] },
    { h: "La symétrie axiale",
      p: ["La symétrie d’axe (d) correspond à un <b>pliage</b> le long de la droite (d). Le point M’ symétrique de M est tel que (d) est la <b>médiatrice</b> du segment [MM’] : (d) coupe [MM’] perpendiculairement en son milieu.",
          "Une figure et son image sont superposables mais « retournées » (comme un objet et son reflet dans un miroir)."],
      dg: { type: "svg", title: "Symétrie axiale", svg: `<svg viewBox="0 0 420 220" role="img" aria-label="Symétrie axiale d’un triangle"><line class="as" x1="210" y1="10" x2="210" y2="210" style="stroke-dasharray:8 6"/><path class="s" d="M80 60 L170 90 L110 170 Z" style="stroke-width:3"/><path class="a" d="M340 60 L250 90 L310 170 Z" style="opacity:.35"/><path class="s" d="M340 60 L250 90 L310 170 Z"/><line class="s" x1="80" y1="60" x2="340" y2="60" style="stroke-dasharray:3 5;stroke-width:1"/><text x="66" y="56">A</text><text x="346" y="56">A’</text><text x="218" y="24" class="at sm">axe (d)</text></svg>`, cap: "A et A’ sont à la même distance de l’axe, sur une perpendiculaire à l’axe." } },
    { h: "La symétrie centrale",

    { h: "La translation",

          "Si M a pour image M’ par la translation qui transforme A en B, alors <b>ABM’M est un parallélogramme</b> (éventuellement aplati). Toutes les flèches qui relient un point à son image sont parallèles, de même sens et de même longueur."],
      dg: { type: "svg", title: "Translation qui transforme A en B", svg: `<svg viewBox="0 0 420 220" role="img" aria-label="Translation d’un carré"><rect class="s" x="40" y="110" width="80" height="80" style="stroke-width:3"/><rect class="a" x="240" y="40" width="80" height="80" style="opacity:.35"/><rect class="s" x="240" y="40" width="80" height="80"/><line class="as" x1="40" y1="190" x2="240" y2="120" style="stroke-width:2.5"/><line class="as" x1="120" y1="110" x2="320" y2="40" style="stroke-width:2.5"/><circle class="ink" cx="40" cy="190" r="4"/><circle class="ink" cx="240" cy="120" r="4"/><text x="26" y="208">A</text><text x="246" y="138">B</text></svg>`, cap: "Chaque point glisse de la même façon que A vers B." } },
    { h: "La rotation",

          "Le point M’ image de M vérifie OM’ = OM (M et M’ sont sur un même cercle de centre O) et l’angle MOM’ est égal à l’angle de la rotation. On construit l’image avec un compas et un rapporteur."],

    { h: "Ce qui est conservé",
      tab: { h: ["Transformation", "Longueurs", "Angles", "Aires", "Orientation"], r: [["Symétrie axiale", "conservées", "conservés", "conservées", "retournée"], ["Symétrie centrale", "conservées", "conservés", "conservées", "conservée"], ["Translation", "conservées", "conservés", "conservées", "conservée"], ["Rotation", "conservées", "conservés", "conservées", "conservée"], ["Homothétie de rapport k", "× |k|", "conservés", "× k²", "conservée"]] },
      p2: ["Ces transformations conservent aussi l’<b>alignement</b>, le <b>parallélisme</b> et la <b>perpendicularité</b> : l’image d’une droite est une droite, l’image d’un carré est un carré."] },

          "L’homothétie est le lien entre Thalès et les transformations : dans la configuration de Thalès, le triangle AMN est l’image de ABC par l’homothétie de centre A et de rapport AM/AB (positif en configuration emboîtée, négatif en configuration papillon)."],
      dg: { type: "svg", title: "Homothétie de centre O et de rapport 2", svg: `<svg viewBox="0 0 420 240" role="img" aria-label="Homothétie de rapport 2"><circle class="ink" cx="40" cy="200" r="5"/><text x="26" y="222">O</text><path class="s" d="M120 160 L170 160 L140 110 Z" style="stroke-width:3"/><path class="a" d="M200 120 L300 120 L240 20 Z" style="opacity:.35"/><path class="s" d="M200 120 L300 120 L240 20 Z"/><line class="as" x1="40" y1="200" x2="300" y2="120" style="stroke-width:1.5;stroke-dasharray:6 5"/><line class="as" x1="40" y1="200" x2="240" y2="20" style="stroke-width:1.5;stroke-dasharray:6 5"/><line class="as" x1="40" y1="200" x2="200" y2="120" style="stroke-width:1.5;stroke-dasharray:6 5"/><text x="330" y="130" class="m sm">OM’ = 2 × OM</text></svg>`, cap: "Chaque point de l’image est deux fois plus loin de O : longueurs × 2, aire × 4." },
      ex: { q: "Un triangle d’aire 6 cm² a pour image un triangle par une homothétie de rapport −3. Quelle est l’aire de l’image ?", s: ["Les longueurs sont multipliées par |−3| = 3.", "Les aires sont multipliées par 3² = 9.", "Aire de l’image = 6 × 9 = 54 cm². Le signe négatif ne change que la position, pas la taille."] } },
    { h: "Frises, pavages et rosaces",

          "Au brevet, on te montre souvent un motif numéroté et on demande « quelle transformation permet de passer du motif 1 au motif 3 ? ». Réponds en nommant la transformation et ses éléments : l’axe, le centre, l’angle et le sens, ou le rapport."],

BREVET_COURS["svt-genetique"] = {
  cours: [
    { h: "Où se trouve l’information génétique ?",
      p: ["Tous les êtres vivants sont formés de <b>cellules</b>. Chez l’être humain, presque chaque cellule possède un <b>noyau</b> qui contient l’<b>information génétique</b> : l’ensemble des instructions qui déterminent les caractères héréditaires (groupe sanguin, couleur des yeux, certaines maladies…).",
          "Cette information est portée par l’<b>ADN</b> (acide désoxyribonucléique), une très longue molécule en forme de double hélice. Pendant la division cellulaire, l’ADN se condense et forme des bâtonnets visibles au microscope : les <b>chromosomes</b>."],
      dg: { type: "flow", title: "Du corps à l’ADN", steps: [ { t: "Organisme", d: "environ 30 000 milliards de cellules" }, { t: "Cellule", d: "elle contient un noyau" }, { t: "Noyau", d: "23 paires de chromosomes" }, { t: "Chromosome", d: "ADN enroulé, porteur de gènes" }, { t: "Gène", d: "portion d’ADN = un caractère" }, { t: "Allèle", d: "une version du gène" } ] } },
    { h: "Chromosomes et caryotype",
      p: ["Le <b>caryotype</b> est la photographie des chromosomes d’une cellule, rangés par paires et par taille. L’espèce humaine possède <b>46 chromosomes</b>, soit <b>23 paires</b>. Dans chaque paire, un chromosome vient du père, l’autre de la mère.",
          "Les 22 premières paires sont identiques chez la femme et chez l’homme. La 23e paire est formée des <b>chromosomes sexuels</b> : <b>XX</b> chez la femme, <b>XY</b> chez l’homme.",
          "Une anomalie du nombre de chromosomes peut avoir des conséquences importantes : la <b>trisomie 21</b> correspond à la présence de trois chromosomes 21 au lieu de deux (47 chromosomes au total)."],
      warn: "Chaque espèce a un nombre de chromosomes caractéristique (46 pour l’humain, 48 pour le chimpanzé, 78 pour le chien). Ce nombre ne dit rien de la « complexité » de l’espèce." },
    { h: "Gènes et allèles",
      p: ["Un <b>gène</b> est une portion d’ADN située à un endroit précis d’un chromosome ; il gouverne un caractère. Exemple : le gène du groupe sanguin, sur le chromosome 9.",
          "Un gène peut exister sous plusieurs versions appelées <b>allèles</b>. Pour le groupe sanguin, il existe trois allèles : A, B et O. Comme on possède deux chromosomes 9, on possède <b>deux allèles</b> de chaque gène, identiques ou différents.",
          "Un allèle <b>dominant</b> s’exprime même s’il n’est présent qu’en un exemplaire ; un allèle <b>récessif</b> ne s’exprime que s’il est présent en deux exemplaires. A et B sont dominants sur O ; A et B sont « codominants » (s’ils sont présents ensemble, on est du groupe AB)."],
      tab: { h: ["Allèles possédés", "Groupe sanguin"], r: [["A et A, ou A et O", "groupe A"], ["B et B, ou B et O", "groupe B"], ["A et B", "groupe AB"], ["O et O", "groupe O"]] } },
    { h: "Gènes et environnement",
      p: ["Les caractères d’un individu dépendent de ses gènes, mais aussi de son <b>environnement</b> : l’alimentation influence la taille, le soleil la couleur de la peau (bronzage), l’entraînement la masse musculaire. Les vrais jumeaux ont le même ADN mais peuvent devenir différents selon leur mode de vie."],
      k: "Caractère = gènes + environnement." },
    { h: "La mitose : transmettre l’information à toutes les cellules",
      p: ["Notre organisme vient d’une seule cellule, la cellule-œuf, qui s’est divisée des milliards de fois. Cette division s’appelle la <b>mitose</b>. Elle permet la croissance et le renouvellement des cellules (peau, sang).",
          "Avant la mitose, chaque chromosome est <b>copié</b> (il est alors formé de deux chromatides identiques). Pendant la mitose, les copies se séparent et chaque cellule fille reçoit un exemplaire de chaque chromosome."],
      dg: { type: "flow", title: "Les étapes de la mitose", steps: [ { t: "Cellule mère", d: "46 chromosomes à une chromatide" }, { t: "Copie de l’ADN", d: "46 chromosomes à deux chromatides" }, { t: "Séparation", d: "les chromatides se répartissent" }, { t: "Deux cellules filles", d: "46 chromosomes chacune, identiques à la mère" } ] },
      k: "La mitose conserve le nombre de chromosomes et l’information génétique : les cellules filles sont des copies conformes." }
  ]
};

/* ---------- quiz ---------- */
function mountQuiz(root, list, opt) {
  opt = opt || {};
  var items = list.map(function (q) {
    var tf = isTF(q.opts), o = q.opts.map(function (t, k) { return { t: t, ok: k === 0 }; });
    o = tf ? o.sort(function (a, b) { return (a.t === "Vrai" ? 0 : 1) - (b.t === "Vrai" ? 0 : 1); }) : shuffle(o);
    return { id: q.id, q: q.q, opts: q.opts, ex: q.ex, sub: q.sub, chap: q.chap, o: o, tf: tf };
  });
  var i = 0, score = 0, done = false, wrong = [], bySub = {};
  if (!items.length) {
    root.innerHTML = '<div class="empty"><b>' + (opt.emptyTitle || "Aucune question ici.") + '</b><p class="mute">' + (opt.empty || "Change de sélection.") + '</p></div>';
    return;
  }
  function draw() {
    if (i >= items.length) return end();
    var q = items[i]; done = false;
    root.innerHTML =
      '<div class="qz-top"><span>Question <b>' + (i + 1) + '</b> / ' + items.length + '</span><span>Score <b class="qz-score">' + score + '</b></span></div>' +
      '<div class="qz-bar"><i style="width:' + (i / items.length * 100) + '%"></i></div>' +
      (opt.mixed ? '<span class="pill" style="--sub:' + col(q.sub) + '"><span>' + S[q.sub].name + ' · ' + q.chap + '</span></span>' : "") +
      (q.tf ? '<span class="tf-tag">Vrai ou faux ?</span>' : "") +
      '<h3 class="qz-q">' + q.q + '</h3>' +
      '<div class="qz-opts' + (q.tf ? " tf" : "") + '">' + q.o.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + (q.tf ? "" : '<span class="opt-l">' + "ABCD".charAt(k) + '</span>') + '<span>' + o.t + '</span></button>'; }).join("") + '</div>' +
      '<div class="qz-fb" hidden></div>';
  }
  function pick(k) {
    if (done) return; done = true;
    var q = items[i], ok = q.o[k].ok;
    if (ok) score++; else wrong.push(q);
    bySub[q.sub] = bySub[q.sub] || { n: 0, ok: 0 }; bySub[q.sub].n++; if (ok) bySub[q.sub].ok++;
    if (ok) delete missed[q.id]; else missed[q.id] = 1;
    store.set("missed", missed);
    Array.prototype.forEach.call(root.querySelectorAll(".opt"), function (b, j) {
      b.disabled = true;
      if (q.o[j].ok) b.classList.add("is-right"); else if (j === k) b.classList.add("is-wrong"); else b.classList.add("is-dim");
    });
    root.querySelector(".qz-score").textContent = score;
    var fb = root.querySelector(".qz-fb");
    fb.hidden = false; fb.className = "qz-fb " + (ok ? "ok" : "ko");
    fb.innerHTML = '<b>' + (ok ? "Bonne réponse." : "Pas tout à fait.") + '</b><p>' + q.ex + '</p><button class="btn btn-fill" data-act="next">' + (i + 1 < items.length ? "Question suivante →" : "Voir mon score") + '</button>';
    fb.querySelector("button").focus({ preventScroll: true });
  }
  function end() {
    var pct = Math.round(score / items.length * 100);
    if (opt.save) { scores[opt.save] = Math.max(scores[opt.save] || 0, pct); store.set("scores", scores); }
    var msg = pct >= 80 ? "Excellent, c’est maîtrisé." : pct >= 50 ? "Pas mal. Relis les corrections et recommence." : "Relis le cours, puis retente le quiz.";
    var subs = Object.keys(bySub);
    root.innerHTML = '<div class="qz-end"><span class="qz-pct">' + pct + '<small>%</small></span><p class="qz-msg"><b>' + plural(score, "bonne réponse") + ' sur ' + items.length + '.</b> ' + msg + '</p>' +
      (subs.length > 1 ? '<div class="qz-subs">' + subs.map(function (s) { var r = bySub[s]; return '<div class="qz-sub" style="--sub:' + col(s) + '"><span>' + S[s].name + '</span><b>' + r.ok + '/' + r.n + '</b><i><em style="width:' + Math.round(r.ok / r.n * 100) + '%"></em></i></div>'; }).join("") + '</div>' : "") +
      (wrong.length ? '<div class="qz-rev"><h4>À revoir</h4>' + wrong.map(function (q) { return '<div class="qz-rev-i"><p>' + q.q + '</p><p><b>Réponse :</b> ' + q.opts[0] + '</p><p class="mute">' + q.ex + '</p></div>'; }).join("") + '</div>' : "") +
      '<div class="row"><button class="btn btn-sub" data-act="restart">' + (opt.restartLabel || "Recommencer") + '</button>' + (opt.more || "") + '</div></div>';
    if (opt.onEnd) opt.onEnd(pct);
  }
  root.onclick = function (e) {
    var o = e.target.closest(".opt"); if (o) return pick(+o.dataset.k);
    var b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "next") { i++; draw(); }
    else if (b.dataset.act === "restart") { if (opt.restart) opt.restart(); else mountQuiz(root, list, opt); }
  };
  keyFn = function (e) {
    var m = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
    if (m != null && !done && i < items.length) pick(m);
  };
  draw();
}

/* ---------- routeur ---------- */
function setNav(k) {
  Array.prototype.forEach.call(document.querySelectorAll(".nav a, .tabbar a"), function (a) { a.classList.toggle("on", a.dataset.nav === k); });
}
function route() {
  keyFn = null;
  var h = decodeURIComponent(location.hash.slice(1)), parts = h.split("-");
  app.style.setProperty("--sub", "var(--fg)");
  if (S[h]) {
    app.style.setProperty("--sub", col(h)); app.innerHTML = viewSubject(S[h]); setNav("home");
    document.title = S[h].name + " · Objectif Brevet";
  } else if (CHI[h]) {
    var c = CHI[h]; store.set("last", c.id);
    app.style.setProperty("--sub", col(c.sub)); app.innerHTML = viewChapter(c); setNav("home");
    document.title = c.title + " · Objectif Brevet";
    var cur = "resume";
    app.querySelector(".tabs").onclick = function (e) { var b = e.target.closest("[data-tab]"); if (b) { cur = b.dataset.tab; drawPanel(c, cur); } };
    document.getElementById("panel").addEventListener("click", function (e) {
      var g = e.target.closest("[data-goto]"); if (g) { cur = g.dataset.goto; drawPanel(c, cur); var t = document.querySelector(".tabs-wrap"); if (t) window.scrollTo({ top: t.offsetTop - 70, behavior: "smooth" }); return; }
      var sc = e.target.closest("[data-scroll]"); if (sc) { e.preventDefault(); var el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: "smooth" }); }
    });
    drawPanel(c, cur);
  } else if (parts[0] === "flashcards") {
    var f = S[parts[1]] ? parts[1] : "all";
    if (f !== "all") app.style.setProperty("--sub", col(f));
    app.innerHTML = viewDeck(f); setNav("flashcards"); document.title = "Flashcards · Objectif Brevet";
    var pool = flat(f === "all" ? CH : B[f], cardsOf);
    var box = document.getElementById("only-review");
    var start = function () { var l = box.checked ? pool.filter(function (x) { return known[x.id] !== 1; }) : pool; mountDeck(document.getElementById("deck"), shuffle(l), { empty: "Bravo, toutes les cartes de cette sélection sont sues." }); };
    box.onchange = start; start();
  } else if (parts[0] === "quiz") {
    if (parts[1] === "erreurs") { qmode = "err"; store.set("qmode", qmode); }
    var fq = S[parts[1]] ? parts[1] : "all";
    if (fq !== "all") app.style.setProperty("--sub", col(fq));
    app.innerHTML = viewQuiz(fq); setNav("quiz"); document.title = "Quiz · Objectif Brevet";
    var qpool = flat(fq === "all" ? CH : B[fq], quizOf);
    var seg = document.getElementById("qmodes");
    var run = function () {
      Array.prototype.forEach.call(seg.children, function (b) { var on = b.dataset.mode === qmode; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
      var errs = qpool.filter(function (q) { return missed[q.id]; });
      document.getElementById("nerr").textContent = errs.length ? errs.length : "";
      var p = qmode === "vf" ? qpool.filter(function (q) { return isTF(q.opts); }) : qmode === "err" ? errs : qpool;
      var n = qmode === "20" ? 20 : qmode === "err" ? p.length : 10;
      mountQuiz(document.getElementById("quiz"), shuffle(p).slice(0, n), {
        mixed: true, restart: run,
        restartLabel: qmode === "err" ? "Revoir mes erreurs" : "Nouvelle série",
        emptyTitle: qmode === "err" ? "Aucune erreur en attente." : "Aucune question ici.",
        empty: qmode === "err" ? "Les questions ratées dans les quiz apparaîtront ici jusqu’à ce que tu y répondes juste." : "Change de matière."
      });
    };
    seg.onclick = function (e) { var b = e.target.closest("[data-mode]"); if (!b) return; qmode = b.dataset.mode; store.set("qmode", qmode); run(); };
    run();
  } else if (h === "examen") {
    app.innerHTML = viewExam(); setNav("examen"); document.title = "L’examen · Objectif Brevet";
  } else {
    app.innerHTML = viewHome(); setNav("home"); document.title = "Objectif Brevet";
  }
  window.scrollTo(0, 0);
}

document.getElementById("strip").innerHTML = SUBJECTS.map(function (s) { return '<a href="#' + s.id + '" style="background:' + col(s.id) + '" aria-label="' + s.name + '"></a>'; }).join("");
document.getElementById("logo-dots").innerHTML = SUBJECTS.map(function (s) { return '<i style="background:' + col(s.id) + '"></i>'; }).join("");
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
