<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objectif Brevet</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brevet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/revisions-laureline-brevet/manifest.json">
<link rel="icon" href="/revisions-laureline-brevet/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/revisions-laureline-brevet/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : pensé d'abord pour le téléphone. Cartes aux coins arrondis façon fenêtres macOS/iOS, filets noirs nets,
   barre d'onglets en bas sur mobile. Le noir et blanc porte tout ; la couleur ne sert qu'à repérer la matière. */
:root{
  --bg:#ffffff; --fg:#0b0b0c; --mute:#6b6b72; --soft:#f2f2f5; --hair:#e2e2e7; --raise:#ffffff;
  --on:#ffffff; --on-dim:rgba(255,255,255,.32);
  --fr:#E5302A; --ma:#0A5BD8; --hg:#C26300; --svt:#178A3E; --pc:#8A3FCB; --te:#00808A;
  --ok:#178A3E; --ko:#E5302A;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px;
  --bw:1.5px;
  --hh:68px;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sub:var(--fg);
  --link:#1558d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --link:#6ea8ff; --bg:#000000; --fg:#f5f5f7; --mute:#9b9ba3; --soft:#1a1a1d; --hair:#2c2c31; --raise:#141416; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark }
}
:root[data-theme="dark"]{ --link:#6ea8ff; --bg:#000000; --fg:#f5f5f7; --mute:#9b9ba3; --soft:#1a1a1d; --hair:#2c2c31; --raise:#141416; --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sub);outline-offset:2px;border-radius:var(--r-xs)}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mute{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:var(--bw) solid var(--fg)}
.top-in{display:flex;align-items:center;gap:24px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.03em;white-space:nowrap}
.logo-dots{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.logo-dots i{width:7px;height:7px;display:block;border-radius:2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;white-space:nowrap;border-radius:999px}
.nav a.on{background:var(--fg);color:var(--bg)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);height:6px}
.strip a{display:block}

.tabbar{display:none}

/* ---------- Typo & sections ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lead{font-size:19px;line-height:1.45;max-width:58ch;color:var(--mute)}
.sec{padding-block:44px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:18px}
.sec-h h2{font-size:28px;font-weight:800}
.sec-h span{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:var(--bw) solid var(--fg);background:var(--bg);color:var(--fg);padding:11px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border-radius:var(--r-sm);transition:transform .12s, background .12s}
.btn:active{transform:scale(.97)}
.btn-fill{background:var(--fg);color:var(--bg)}
.btn-sub{background:var(--sub);border-color:var(--sub);color:var(--on)}
.link{background:none;border:0;padding:8px 0;font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1fr 300px;gap:32px;padding-block:56px 8px;align-items:end}
.hero h1{font-size:clamp(2.3rem,6.4vw,5rem);font-weight:800;line-height:.95;letter-spacing:-.045em;margin:14px 0 18px}
.hero .row{margin-top:26px}
.count{border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:4px}
.count-n{font-size:96px;font-weight:800;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.count-l{font-weight:700;font-size:17px}
.count-s{font-size:13px;color:var(--mute)}
.count-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:14px}
.count-bar i{height:8px;display:block;border-radius:4px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;min-height:230px;padding:20px;border-radius:var(--r-lg);background:var(--sub);color:var(--on);text-decoration:none;transition:transform .16s}
.tile:active{transform:scale(.98)}
.tile-code{font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:.8}
.tile-name{margin-top:auto;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile-meta{font-size:13px;opacity:.9;margin-top:4px}
.tile-arrow{position:absolute;top:18px;right:20px;font-size:24px;font-weight:700}
.bar{display:block;height:6px;background:var(--on-dim);margin-top:14px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on);border-radius:3px}

.today{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-height:190px;transition:background .12s}
.tcard b{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tcard h3{font-size:19px;font-weight:800}
.tcard p{font-size:14px;color:var(--mute)}
.tcard .go{margin-top:auto;font-weight:700;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden;margin-top:40px}
.stat{padding:18px 20px;border-right:var(--bw) solid var(--fg)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:40px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--mute)}

/* ---------- Matière ---------- */
.band{width:min(1148px, calc(100% - 2 * max(16px, env(safe-area-inset-left,0px))));margin:20px auto 0;border-radius:var(--r-lg);background:var(--sub);color:var(--on)}
.band .wrap{padding-left:28px;padding-right:28px}
.band-in{padding-block:30px 28px}
.band h1{font-size:clamp(2.4rem,7vw,5.2rem);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:16px 0 12px}
.band p{font-size:18px;max-width:58ch;opacity:.92}
.band-meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.band-meta span{border:var(--bw) solid var(--on);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.band .btn{background:var(--on);color:#0b0b0c;border-color:var(--on)}
.band .btn.ghost{background:transparent;color:var(--on)}
.crumb{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700}
.crumb a{text-decoration:none;opacity:.85}
.crumb span{opacity:.5}

.chaps{list-style:none;margin:0;padding:0;border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden}
.chaps li + li .chap-row{border-top:1px solid var(--hair)}
.chap-row{display:grid;grid-template-columns:64px 1fr 120px 24px;gap:16px;align-items:center;padding:18px 18px;text-decoration:none;transition:background .12s}
.chap-row .num{font-size:38px;font-weight:800;letter-spacing:-.05em;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1}
.chap-row .ct{min-width:0;display:flex;flex-direction:column;gap:3px}
.chap-row .ct b{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.chap-row .sum{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap-row .arrow{font-size:20px;font-weight:700;color:var(--mute)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.mini{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .track{height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.mini .track i{display:block;height:100%;background:var(--sub);border-radius:3px}

/* ---------- Chapitre ---------- */
.chead .crumb{padding-top:24px;color:var(--mute)}
.chead-row{display:flex;gap:20px;align-items:flex-end;margin:16px 0 18px}
.chead-n{flex:none;width:100px;height:100px;border-radius:var(--r-lg);background:var(--sub);color:var(--on);display:grid;place-items:center;font-size:50px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.chead-t{min-width:0}
.chead h1{font-size:clamp(1.8rem,5vw,3.6rem);font-weight:800;line-height:1.02;letter-spacing:-.04em;margin-top:6px}
.chead-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--mute);padding-bottom:16px}
.chead-meta b{color:var(--fg)}

.tabs-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--hair)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:var(--r-sm);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--sub);color:var(--on);box-shadow:var(--shadow)}
.tab small{font-weight:600;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.t-short{display:none}
.deck-top > span:first-child{white-space:nowrap}

.panel{padding-block:30px 16px;min-height:340px}
.ph{font-size:28px;font-weight:800;margin-bottom:16px}

.resume ol{list-style:none;margin:0;padding:0}
.resume li{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--hair);align-items:start}
.resume li:first-child{border-top:2px solid var(--fg)}
.rn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--sub);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:18px}
.resume li p{font-size:clamp(1.08rem,2.3vw,1.45rem);line-height:1.38;font-weight:500;max-width:52ch}
.resume li p b{font-weight:800}
.next-steps{margin-top:24px}

.cours{display:grid;grid-template-columns:220px 1fr;gap:48px}
.toc{position:sticky;top:calc(var(--hh) + 90px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none;color:var(--mute);border-radius:var(--r-xs)}
.cbody{min-width:0;display:flex;flex-direction:column;gap:36px}
.cs h3{font-size:24px;font-weight:800;padding-bottom:10px;border-bottom:2px solid var(--fg);margin-bottom:14px;scroll-margin-top:calc(var(--hh) + 90px)}
.cs p{font-size:17px;line-height:1.6;max-width:68ch}
.sq{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px;max-width:70ch}
.sq li{position:relative;padding-left:22px;font-size:17px;line-height:1.55}
.sq li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:3px;background:var(--sub)}
.key{margin-top:18px;border:var(--bw) solid var(--sub);border-radius:var(--r);overflow:hidden;max-width:70ch}
.key span{display:block;background:var(--sub);color:var(--on);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px}
.key p{padding:12px 16px 14px;font-size:16px;font-weight:600}
.code{margin:12px 0 0;padding:16px 18px;background:var(--soft);border-radius:var(--r-sm);font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;white-space:pre}

/* ---------- Schémas ---------- */
.dgs{display:flex;flex-direction:column;gap:22px}
.dg{margin:0;border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:22px}
.dg-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.dg-h::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--sub);flex:none}
.dg-cap{font-size:13px;color:var(--mute);margin-top:14px;max-width:70ch}
.dg-svg svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.dg-svg svg text{fill:var(--fg);font:600 14px var(--font)}
.dg-svg .s{fill:none;stroke:var(--fg);stroke-width:2}
.dg-svg .as{fill:none;stroke:var(--sub);stroke-width:3.5}
.dg-svg .a{fill:var(--sub)}
.dg-svg .ink{fill:var(--fg)}
.dg-svg .bgf{fill:var(--bg)}
.dg-svg .grid line{stroke:var(--hair);stroke-width:1}
.dg-svg .nd{fill:var(--bg);stroke:var(--sub);stroke-width:2.5;rx:12px}
.dg-svg text.w{fill:var(--on)}
.dg-svg text.m{fill:var(--mute)}
.dg-svg text.at{fill:var(--sub);font-weight:800}
.dg-svg text.sm{font-size:12px}
.dg-svg text.lg{font-size:15px;font-weight:800}
.dg-svg rect.a{rx:10px}

.flow-wrap{overflow-x:auto;padding-bottom:4px}
.flow{list-style:none;margin:0;padding:0;display:flex;gap:30px;min-width:min-content}
.flow li{position:relative;flex:1 1 0;min-width:140px;border:var(--bw) solid var(--fg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-25px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;color:var(--sub)}
.flow-n{width:26px;height:26px;border-radius:8px;background:var(--sub);color:var(--on);display:grid;place-items:center;font-size:13px;font-weight:800}
.flow b{font-size:16px;font-weight:800;line-height:1.2}
.flow span{font-size:13px;color:var(--mute);line-height:1.4}

.tl{list-style:none;margin:0;padding:0 0 0 4px;border-left:3px solid var(--sub)}
.tl li{position:relative;display:grid;grid-template-columns:130px 1fr;gap:16px;padding:10px 0 10px 22px}
.tl li::before{content:"";position:absolute;left:-10px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--sub);border:3px solid var(--bg)}
.tl-d{font-weight:800;font-variant-numeric:tabular-nums}
.tl-t{display:flex;flex-direction:column;min-width:0}
.tl-t b{font-weight:700}
.tl-t span{font-size:14px;color:var(--mute)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg);border-radius:var(--r);overflow:hidden}
.dcell{background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:6px}
.dcell b{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:pre-wrap}
.dcell span{font-size:14px;line-height:1.45}
.dcell em{font-style:normal;font-size:13px;color:var(--sub);font-weight:700}

.tree{display:flex;flex-direction:column;align-items:center}
.tree-root{background:var(--sub);color:var(--on);padding:12px 22px;border-radius:var(--r-sm);font-weight:800;font-size:18px;position:relative;text-align:center}
.tree-root::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:20px;background:var(--fg)}
.tree-kids{margin-top:20px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;border-top:2px solid var(--fg);padding-top:18px}
.tree-kid{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.tree-kid::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--sub)}
.tree-kid b{font-size:17px;font-weight:800;margin-top:2px}
.tree-kid > span{font-size:14px;color:var(--mute)}
.tree-kid ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tree-kid li{font-size:14px;background:var(--soft);border-radius:var(--r-xs);padding:7px 10px;font-weight:600}

/* ---------- Flashcards ---------- */
.deck{max-width:640px;margin:0 auto}
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mute);min-width:0}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sub);flex:none}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{position:relative;display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;perspective:1400px;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .25s ease}
.fc-in{position:relative;display:block;height:340px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.is-flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:26px;border:2px solid var(--fg);border-radius:var(--r-lg);background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.fc-back{transform:rotateY(180deg);background:var(--sub);border-color:var(--sub);color:var(--on)}
.fc-k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.fc-t{font-size:clamp(1.35rem,5.4vw,2.1rem);font-weight:800;line-height:1.2;letter-spacing:-.02em}
.fc-hint{font-size:13px;color:var(--mute);font-weight:600}
.fc-st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.fc::after{position:absolute;top:18px;z-index:2;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--on);pointer-events:none}
.fc[data-sw="yes"]::after{content:"Je sais ✓";right:18px;background:var(--ok)}
.fc[data-sw="no"]::after{content:"À revoir";left:18px;background:var(--ko)}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.deck-actions .btn{min-height:54px;font-size:16px;border-radius:var(--r)}
.deck-foot{display:flex;justify-content:space-between;margin-top:6px}
.kbd{text-align:center;font-size:13px;color:var(--mute);margin-top:16px;padding-inline:8px}
.done,.empty{border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.done-n{font-size:80px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- Quiz ---------- */
.quiz{max-width:720px;margin:0 auto}
.qz-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.qz-bar{height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin:10px 0 20px}
.qz-bar i{display:block;height:100%;background:var(--sub);border-radius:3px;transition:width .3s}
.tf-tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--soft);border-radius:999px;padding:5px 10px}
.qz-q{font-size:clamp(1.35rem,5vw,2rem);font-weight:800;line-height:1.2;letter-spacing:-.025em;margin:10px 0 20px}
.qz-opts{display:flex;flex-direction:column;gap:10px}
.qz-opts.tf{display:grid;grid-template-columns:1fr 1fr}
.qz-opts.tf .opt{justify-content:center;min-height:76px;font-size:20px;font-weight:800}
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:58px;text-align:left;border:var(--bw) solid var(--fg);border-radius:var(--r);background:var(--bg);color:var(--fg);padding:12px 16px;font-size:17px;font-weight:600;cursor:pointer;transition:background .12s, transform .1s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt[disabled]{cursor:default;opacity:1}
.opt-l{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:var(--bw) solid currentColor;font-weight:800;font-size:14px}
.opt.is-right{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.is-wrong{background:var(--ko);border-color:var(--ko);color:var(--on)}
.opt.is-dim{opacity:.4}
.qz-fb{margin-top:16px;border:var(--bw) solid var(--fg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.qz-fb b{font-size:18px}
.qz-fb.ok b{color:var(--ok)}
.qz-fb.ko b{color:var(--ko)}
.qz-fb .btn{margin-top:6px}
.qz-end{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.qz-pct{font-size:clamp(5rem,22vw,9rem);font-weight:800;letter-spacing:-.06em;line-height:.85;color:var(--sub)}
.qz-pct small{font-size:.4em}
.qz-msg{font-size:19px;max-width:52ch}
.qz-subs{width:100%;display:flex;flex-direction:column;gap:10px;border:var(--bw) solid var(--fg);border-radius:var(--r);padding:16px}
.qz-sub{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.qz-sub i{grid-column:1 / -1;height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.qz-sub em{display:block;height:100%;background:var(--sub);border-radius:3px}
.qz-rev{width:100%;border-top:2px solid var(--fg)}
.qz-rev h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:14px 0 4px}
.qz-rev-i{padding:12px 0;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:4px;font-size:15px}
.qz-rev-i p:first-child{font-weight:700}

/* ---------- En-têtes de page, filtres ---------- */
.page-h{padding-block:40px 20px}
.page-h h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:12px 0 14px}
.seg{display:flex;gap:3px;padding:4px;margin-top:22px;background:var(--soft);border-radius:var(--r-sm);overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:var(--shadow)}
.seg small{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ko);color:var(--on);font-size:11px;font-weight:800;margin-left:4px}
.seg small:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:var(--bw) solid var(--fg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:var(--bg)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--sub);display:block}
.chip.on{background:var(--sub);border-color:var(--sub);color:var(--on)}
.chip.on i{background:var(--on)}
.chip.all.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.toggle{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;font-weight:700;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--fg);flex:none}

/* ---------- Examen ---------- */
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.day{border:var(--bw) solid var(--fg);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.day h3{font-size:20px;font-weight:800}
.ev{display:grid;grid-template-columns:6px 1fr;gap:14px}
.ev-sw{border-radius:3px}
.ev-t{display:block;font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.ev b{display:block;font-size:18px;font-weight:800}
.ev p{font-size:14px;color:var(--mute);margin-top:2px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plan div{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.plan b{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.plan h3{font-size:19px;font-weight:800}
.plan p{font-size:14px;color:var(--mute)}
.tips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);column-gap:28px}
.tips li{padding:14px 0;border-bottom:1px solid var(--hair);font-size:16px}
.note{font-size:13px;color:var(--mute);margin-top:14px;max-width:80ch}

/* ---------- Précédent / suivant, pied ---------- */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:24px 8px}
.pn-a{border:var(--bw) solid var(--fg);border-radius:var(--r);padding:14px 18px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:background .12s}
.pn-a span{font-size:13px;color:var(--mute);font-weight:700}
.pn-a b{font-size:17px;font-weight:800}
.pn-next{text-align:right}
footer{margin-top:56px;border-top:var(--bw) solid var(--fg)}
.foot{padding-block:20px 30px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}

/* ---------- Survol : seulement avec une souris ---------- */
@media (hover:hover){
  .nav a:hover:not(.on){background:var(--soft)}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
  .tcard:hover,.chap-row:hover,.pn-a:hover,.toc a:hover,.chip:not(.on):hover{background:var(--soft)}
  .opt:hover:not([disabled]){background:var(--soft)}
  .tab:not(.on):hover{color:var(--fg)}
  .crumb a:hover{opacity:1;text-decoration:underline}
}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,1fr)}

/* ---------- Barre d'actions et recherche ---------- */
.top-act{display:flex;align-items:center;gap:8px;margin-left:8px}
.srch-btn{display:flex;align-items:center;gap:8px;border:0;background:var(--soft);color:var(--mute);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.srch-btn svg,.srch-bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-weight:800;font-size:16px;cursor:pointer}
.avatar:empty{display:none}
.srch{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.srch-top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px);z-index:2}
.srch-bar{display:flex;align-items:center;gap:10px;min-height:64px}
.srch-bar svg{color:var(--mute);width:22px;height:22px}
#srch-in{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;color:var(--fg);background:var(--soft);border:0;border-radius:var(--r-sm);padding:12px 14px}
#srch-in:focus{outline:3px solid var(--link);outline-offset:1px}
.srch-x{flex:none}
.srch-res{padding-block:10px 20px;max-width:760px}
.srch-h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.srch-h small{background:var(--soft);border-radius:999px;padding:2px 8px;margin-left:6px;color:var(--fg)}
.srch-list{display:flex;flex-direction:column;gap:8px}
.srch-it,.srch-card{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;border:var(--bw) solid var(--hair);border-left:5px solid var(--sub);border-radius:var(--r);background:var(--bg);color:var(--fg);padding:12px 14px;font:inherit;cursor:pointer}
.srch-card{cursor:default}
.srch-it b,.srch-card b{font-size:16px;font-weight:800;line-height:1.3}
.srch-sn,.srch-card > span:not(.pill){font-size:14px;color:var(--mute);line-height:1.45}
.srch-go{font-size:13px;font-weight:700;color:var(--link);text-decoration:none;margin-top:2px}
mark{background:color-mix(in srgb, #ffd60a 55%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.cs-hit{animation:hit 2.4s ease-out}
@keyframes hit{0%,30%{background:color-mix(in srgb, #ffd60a 25%, transparent)}100%{background:transparent}}
@media (hover:hover){ .srch-it:hover{border-color:var(--sub)} .srch-btn:hover{color:var(--fg)} }
@media (max-width:760px){
  .top-act{margin-left:auto}
  .srch-btn span{display:none}
  .srch-btn{width:38px;padding:0;justify-content:center}
  .avatar{width:34px;height:34px;font-size:15px}
}

/* ---------- Dictionnaire et carnet ---------- */
.dk{text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--mute);cursor:help;border-radius:4px}
.dk:hover{background:var(--soft)}
.fc-back .dk{text-decoration-color:var(--on)}
#app{-webkit-touch-callout:none}
.dk-k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.dk-ex{font-style:italic;color:var(--mute);font-size:15px}
.dk-ok{font-size:13px;font-weight:700;color:var(--ok)}
.dk-nat{font-size:13px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.wk-body .row .btn{margin-top:0}
.today{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){ .today{grid-template-columns:repeat(2,1fr)} }
.carnet-chip{margin-top:12px}
.carnet-top{margin-bottom:16px}
.carnet-list{display:flex;flex-direction:column;gap:8px}
.carnet-it{display:flex;gap:12px;align-items:flex-start;border:var(--bw) solid var(--hair);border-radius:var(--r);padding:12px 14px}
.carnet-it > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.carnet-it b{font-size:18px;font-weight:800}
.carnet-it p{font-size:15px}
.carnet-it small{font-size:12px;color:var(--mute)}
.carnet-x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-weight:800}

/* ---------- Cartes mentales ---------- */
.mm-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.mm-score{font-weight:800;font-variant-numeric:tabular-nums}
.mm-zoom{margin-left:auto;display:flex;gap:6px}
.mm-zoom button{width:38px;height:38px;border-radius:50%;border:var(--bw) solid var(--fg);background:var(--bg);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.mm-help{font-size:13px;color:var(--mute);margin:10px 0 12px}
.mm-wrap{border:var(--bw) solid var(--hair);border-radius:var(--r-lg);background:#fffdf8;overflow:auto;-webkit-overflow-scrolling:touch;max-height:78vh}
.mm-in{margin:0 auto}
.mm-svg{display:block;width:100%;height:auto}
.mm-svg text{font:600 14px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1b1f}
.mm-svg .mm-bt{font-size:17px;font-weight:800}
.mm-svg .mm-ico{font-size:24px}
.mm-svg .mm-tg{fill:#fff;font-size:16px;font-weight:800}
.mm-svg .mm-ct{fill:#fff;font-size:20px;font-weight:800}
.mm-svg .mm-c-ico{font-size:52px}
.mm-c-bg{fill:#fff;stroke-width:6}
.mm-br{cursor:pointer}
.mm-q{cursor:pointer}
.mm-q rect{fill:#fff;stroke:var(--c);stroke-width:2;stroke-dasharray:5 4}
.mm-svg .mm-q text{font-weight:800;fill:var(--c);font-size:17px}
.mm-sel rect{fill:color-mix(in srgb, var(--c) 22%, #fff);stroke-dasharray:none;stroke-width:3}
.mm-ok text{font-weight:800}
.mm-svg .mm-ok text{fill:#178A3E}
.mm-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-height:38vh;overflow:auto}
.mm-opts .chip{cursor:pointer}
.mm-bad{background:var(--ko)!important;border-color:var(--ko)!important;color:var(--on)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mm-end{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:var(--bw) solid var(--ok);border-radius:var(--r);padding:16px}
.mm-end b{font-size:20px;color:var(--ok)}
@media (max-width:760px){
  .tabs{grid-template-columns:repeat(6,1fr)}
  .tab{font-size:12px;padding:9px 0}
  .mm-wrap{border-radius:var(--r);max-height:70vh}
  .mm-opts{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0;border-top:1px solid var(--hair)}
}
</style>

<script>
window.BREVET = {}; var BREVET = window.BREVET; var BREVET_EXTRA = {}; var BREVET_COURS = {}; var BREVET_COURS_PLUS = {}; var BREVET_MORE = {}; var BREVET_WIKI = {}; var BREVET_COVERS = {}; var BREVET_IMGS = {}; var BREVET_DICO = {}; var BREVET_MAPS = {}; var BREVET_MAP_ICONS = {};
BREVET.fr = [
{
  id: "fr-phrase", tag: "Grammaire", title: "La phrase complexe",
  resume: [
    "Une phrase simple contient <b>un seul verbe conjugué</b>. Une phrase complexe en contient plusieurs : elle est formée de plusieurs <b>propositions</b>.",
    "Les propositions sont reliées par <b>juxtaposition</b> (ponctuation), <b>coordination</b> (mais, ou, et, donc, or, ni, car) ou <b>subordination</b>.",
    "Trois subordonnées à connaître : la <b>relative</b>, la <b>conjonctive complétive</b> et la <b>circonstancielle</b>.",
    "Pour identifier une proposition, on donne sa <b>nature</b> (relative, complétive…) et sa <b>fonction</b> (complément de l’antécédent, COD, complément circonstanciel)."
  ],
  cours: [
    { h: "Repérer les propositions", p: "Compte les verbes conjugués : autant de verbes conjugués, autant de propositions. La proposition <b>principale</b> ne dépend d’aucune autre. La <b>subordonnée</b> dépend toujours d’une principale et ne peut pas exister seule.", k: "Encadre chaque verbe conjugué, puis cherche où commence et où s’arrête sa proposition." },
    { h: "Juxtaposition et coordination", p: "Les propositions juxtaposées sont séparées par une virgule, un point-virgule ou deux-points. Les propositions coordonnées sont reliées par une conjonction de coordination ou un adverbe de liaison (puis, ensuite, pourtant).", l: ["« Il pleut ; nous restons à la maison. » → propositions juxtaposées.", "« Il pleut, donc nous restons à la maison. » → propositions coordonnées."] },
    { h: "Les trois subordonnées", l: [
      "<b>Relative</b> : introduite par un pronom relatif (qui, que, quoi, dont, où, lequel). Elle complète un nom, appelé <b>antécédent</b>. « Le livre <u>que tu m’as prêté</u> est génial. »",
      "<b>Conjonctive complétive</b> : introduite par « que ». Elle est le plus souvent COD du verbe principal. « Je pense <u>qu’il viendra</u>. »",
      "<b>Circonstancielle</b> : introduite par une conjonction de subordination (quand, parce que, bien que, si, pour que, si bien que…). Elle exprime le temps, la cause, la conséquence, le but, la concession ou la condition."
    ] },
    { h: "Au brevet", p: "On te demande souvent d’identifier la nature ou la fonction d’une proposition, ou de réunir deux phrases simples en une phrase complexe. Justifie toujours ta réponse en citant le mot qui introduit la proposition.", k: "Relative = il y a un antécédent. Complétive = pas d’antécédent, elle répond à « quoi ? » après le verbe." }
  ],
  schema: [
    { type: "tree", title: "Relier des propositions", root: "Phrase complexe", kids: [
      { t: "Juxtaposition", d: "Ponctuation : virgule, point-virgule, deux-points" },
      { t: "Coordination", d: "Mais, ou, et, donc, or, ni, car" },
      { t: "Subordination", d: "Une principale + une subordonnée", kids: ["Relative : qui, que, dont, où", "Complétive : que", "Circonstancielle : quand, parce que, si…"] }
    ] }
  ],
  cards: [
    ["Combien de propositions compte une phrase ?", "Autant que de verbes conjugués."],
    ["Les 7 conjonctions de coordination ?", "Mais, ou, et, donc, or, ni, car."],
    ["Qu’est-ce qu’un antécédent ?", "Le nom (ou pronom) que complète la subordonnée relative."],
    ["Fonction habituelle d’une complétive ?", "COD du verbe de la proposition principale."],
    ["Les pronoms relatifs simples ?", "Qui, que, quoi, dont, où."]
  ],
  quiz: [
    ["« Je sais <u>que tu as raison</u>. » La proposition soulignée est…", ["une subordonnée conjonctive complétive", "une subordonnée relative", "une proposition coordonnée", "une subordonnée circonstancielle de cause"], "« Que » introduit ici le COD du verbe « savoir ». Il n’y a pas d’antécédent : ce n’est pas une relative."],
    ["« La ville <u>où je suis né</u> est petite. » Nature de la proposition ?", ["subordonnée relative", "subordonnée complétive", "proposition indépendante", "subordonnée circonstancielle de lieu"], "« Où » est un pronom relatif. Son antécédent est « la ville »."],
    ["« Il est sorti <u>bien qu’il pleuve</u>. » La subordonnée exprime…", ["la concession", "la cause", "le but", "la conséquence"], "« Bien que » suivi du subjonctif exprime une opposition, une concession."],
    ["Quelle phrase contient des propositions juxtaposées ?", ["Je suis venu, j’ai vu, j’ai vaincu.", "Je suis venu car j’avais vu.", "Je suis venu mais je n’ai rien vu.", "Je suis venu quand tu m’as vu."], "Les propositions sont seulement séparées par des virgules, sans mot de liaison."]
  ]
},
{
  id: "fr-conjugaison", tag: "Conjugaison", title: "Les temps et les modes",
  resume: [
    "Quatre <b>modes personnels</b> : l’indicatif (le réel), le subjonctif (souhait, doute, obligation), le conditionnel (hypothèse) et l’impératif (ordre).",
    "Chaque temps simple a son <b>temps composé</b> : auxiliaire avoir ou être conjugué + participe passé.",
    "Dans un récit au passé : l’<b>imparfait</b> pour l’arrière-plan et les descriptions, le <b>passé simple</b> pour les actions de premier plan.",
    "Après « si » d’hypothèse, jamais de conditionnel : « Si j’<b>avais</b> su, je serais venu. »"
  ],
  cours: [
    { h: "Les modes", l: [
      "<b>Indicatif</b> : présent, imparfait, passé simple, futur, passé composé, plus-que-parfait, passé antérieur, futur antérieur.",
      "<b>Subjonctif</b> : après « il faut que », « bien que », « pour que », « avant que ». « Il faut que tu <b>viennes</b>. »",
      "<b>Conditionnel</b> : hypothèse, politesse, futur dans le passé. « Si j’avais le temps, je <b>viendrais</b>. »",
      "<b>Impératif</b> : ordre ou conseil, sans sujet exprimé. « <b>Viens</b> ! »",
      "Modes impersonnels : infinitif, participe, gérondif (« en marchant »)."
    ] },
    { h: "Les valeurs du présent", l: [
      "Présent d’<b>énonciation</b> : ce qui se passe au moment où l’on parle.",
      "Présent de <b>vérité générale</b> : « La Terre <b>tourne</b> autour du Soleil. »",
      "Présent d’<b>habitude</b> : « Je <b>me lève</b> à 7 h. »",
      "Présent de <b>narration</b> : rend un récit passé plus vivant."
    ] },
    { h: "Les pièges classiques", l: [
      "Futur (-rai) ou conditionnel (-rais) : « je chanterai demain » / « je chanterais si j’osais ».",
      "Passé simple du 1er groupe : je chant<b>ai</b> (sans s). Imparfait : je chant<b>ais</b>.",
      "Après « bien que » : subjonctif. Après « après que » : indicatif."
    ], k: "Pour distinguer futur et conditionnel, remplace « je » par « nous » : nous chanterons (futur) / nous chanterions (conditionnel)." }
  ],
  schema: [
    { type: "flow", title: "Situer les temps de l’indicatif", steps: [
      { t: "Plus-que-parfait", d: "j’avais chanté · avant une action passée" },
      { t: "Imparfait / passé simple", d: "je chantais / je chantai · le passé" },
      { t: "Passé composé", d: "j’ai chanté · action achevée" },
      { t: "Présent", d: "je chante · maintenant" },
      { t: "Futur antérieur", d: "j’aurai chanté · avant une action future" },
      { t: "Futur simple", d: "je chanterai · l’avenir" }
    ] },
    { type: "grid", title: "Les quatre modes personnels", items: [
      { t: "Indicatif", d: "Le réel, ce qui est certain.", ex: "Il vient." },
      { t: "Subjonctif", d: "Le souhait, le doute, l’obligation.", ex: "Il faut qu’il vienne." },
      { t: "Conditionnel", d: "L’hypothèse, la politesse.", ex: "Il viendrait si…" },
      { t: "Impératif", d: "L’ordre, le conseil.", ex: "Viens !" }
    ] }
  ],
  cards: [
    ["Terminaisons du passé simple, 1er groupe ?", "-ai, -as, -a, -âmes, -âtes, -èrent."],
    ["Quel mode après « bien que » ?", "Le subjonctif : « bien qu’il soit tard »."],
    ["« Si tu viens, je … content. » (être)", "Je serai content : si + présent → futur."],
    ["Valeur de l’imparfait dans un récit ?", "Description, arrière-plan, action qui dure ou se répète."],
    ["Comment se forme un temps composé ?", "Auxiliaire avoir ou être conjugué + participe passé."]
  ],
  quiz: [
    ["« L’eau bout à 100 °C. » Valeur du présent ?", ["vérité générale", "présent d’énonciation", "présent de narration", "habitude"], "C’est vrai en tout temps : présent de vérité générale."],
    ["Quelle phrase est correcte ?", ["Si j’avais su, je serais venu.", "Si j’aurais su, je serais venu.", "Si j’aurais su, je serai venu.", "Si j’avais su, je serai venu."], "Si + plus-que-parfait, puis conditionnel passé dans la principale."],
    ["« Il faut que tu … ce livre. » (lire)", ["lises", "lis", "liras", "lirais"], "« Il faut que » impose le subjonctif présent."],
    ["« Il marchait quand il <u>vit</u> un chat. » « Vit » est au…", ["passé simple", "imparfait", "présent", "passé composé"], "Action brève de premier plan : passé simple du verbe « voir »."]
  ]
},
{
  id: "fr-figures", tag: "Analyse littéraire", title: "Les figures de style",
  resume: [
    "Une figure de style crée un <b>effet</b> sur le lecteur. Il faut toujours la <b>nommer</b> et <b>expliquer</b> son effet.",
    "Figures d’analogie : <b>comparaison</b> (avec un outil), <b>métaphore</b> (sans outil), <b>personnification</b>.",
    "Figures d’insistance : <b>hyperbole</b>, <b>anaphore</b>, <b>gradation</b>, <b>accumulation</b>.",
    "Figures d’opposition et d’atténuation : <b>antithèse</b>, <b>oxymore</b>, <b>litote</b>, <b>euphémisme</b>."
  ],
  cours: [
    { h: "Rapprocher deux réalités", l: [
      "<b>Comparaison</b> : avec un outil (comme, tel, pareil à, ressembler à). « Il est rusé <b>comme</b> un renard. »",
      "<b>Métaphore</b> : rapprochement sans outil. « Cet homme est un renard. » Prolongée sur plusieurs lignes, c’est une métaphore <b>filée</b>.",
      "<b>Personnification</b> : donne des traits humains à une chose ou un animal. « Le vent hurle. »"
    ] },
    { h: "Insister, amplifier", l: [
      "<b>Hyperbole</b> : exagération. « Je meurs de faim. »",
      "<b>Anaphore</b> : répétition d’un mot en début de vers ou de phrase.",
      "<b>Gradation</b> : termes d’intensité croissante. « Va, cours, vole ! »",
      "<b>Accumulation</b> : suite de mots de même nature qui donne une impression d’abondance."
    ] },
    { h: "Opposer, atténuer", l: [
      "<b>Antithèse</b> : oppose deux idées dans une phrase. « Je vis, je meurs. »",
      "<b>Oxymore</b> : deux mots contraires accolés. « Cette obscure clarté » (Corneille).",
      "<b>Litote</b> : dire moins pour suggérer plus. « Va, je ne te hais point » (Corneille).",
      "<b>Euphémisme</b> : adoucir une réalité pénible. « Il nous a quittés. »"
    ] },
    { h: "Méthode de réponse", p: "1. Cite le passage entre guillemets. 2. Nomme la figure. 3. Explique l’effet produit et son lien avec le sens du texte.", k: "Une figure nommée sans interprétation ne rapporte presque aucun point." }
  ],
  schema: [
    { type: "grid", title: "Les dix figures à connaître", items: [
      { t: "Comparaison", d: "Rapprochement avec un outil.", ex: "Blanc comme neige" },
      { t: "Métaphore", d: "Rapprochement sans outil.", ex: "Un océan de blé" },
      { t: "Personnification", d: "Une chose agit comme un humain.", ex: "La ville dort" },
      { t: "Hyperbole", d: "Exagération.", ex: "Mourir de rire" },
      { t: "Anaphore", d: "Répétition en début de phrase.", ex: "Paris ! Paris outragé !" },
      { t: "Gradation", d: "Intensité croissante.", ex: "Va, cours, vole" },
      { t: "Antithèse", d: "Deux idées opposées.", ex: "Je vis, je meurs" },
      { t: "Oxymore", d: "Deux contraires accolés.", ex: "Un silence assourdissant" },
      { t: "Litote", d: "Dire moins pour dire plus.", ex: "Ce n’est pas mal" },
      { t: "Euphémisme", d: "Adoucir une réalité.", ex: "Il s’est éteint" }
    ] }
  ],
  cards: [

BREVET_COURS["hg-1gm"] = {
  cours: [
    { h: "Les causes et le début de la guerre",
      p: ["Au début du XXe siècle, l’Europe domine le monde mais elle est divisée par des rivalités : rivalités coloniales et économiques, nationalismes (la France veut récupérer l’Alsace-Moselle perdue en 1871), course aux armements. Deux systèmes d’alliances s’opposent : la <b>Triple-Entente</b> (France, Royaume-Uni, Russie) et la <b>Triple-Alliance</b> (Allemagne, Autriche-Hongrie, Italie).",
          "Le 28 juin 1914, l’archiduc François-Ferdinand, héritier de l’Autriche-Hongrie, est assassiné à <b>Sarajevo</b> par un nationaliste serbe. Le jeu des alliances entraîne une guerre européenne en quelques jours : l’Allemagne déclare la guerre à la France le 3 août 1914. L’Italie rejoint finalement l’Entente en 1915 ; l’Empire ottoman se range du côté des <b>Empires centraux</b>."] },
    { h: "De la guerre de mouvement à la guerre de position",
      p: ["En août 1914, chacun croit à une guerre courte. L’armée allemande envahit la Belgique et le nord de la France, mais elle est arrêtée lors de la <b>bataille de la Marne</b> (septembre 1914). Après une « course à la mer », le front se stabilise de la mer du Nord à la Suisse.",
          "Commence alors la <b>guerre de position</b> : les soldats s’enterrent dans des <b>tranchées</b> pendant quatre ans. Les « poilus » vivent dans la boue, le froid, les rats, les poux, sous les bombardements d’artillerie. Les offensives pour percer le front échouent et coûtent des centaines de milliers de vies. Des armes nouvelles apparaissent : gaz de combat (1915), chars, avions, mitrailleuses."] },
    { h: "Verdun et la Somme : les batailles de 1916",
      p: ["La <b>bataille de Verdun</b> (février-décembre 1916) est lancée par l’Allemagne pour « saigner à blanc » l’armée française. Elle fait plus de 300 000 morts français et allemands pour un gain de terrain presque nul. Grâce à la « voie sacrée » qui permet la rotation des troupes, presque toute l’armée française y combat : Verdun devient le symbole de la guerre en France.",
          "La <b>bataille de la Somme</b> (juillet-novembre 1916), offensive franco-britannique, est encore plus meurtrière : plus d’un million de soldats tués, blessés ou disparus. Ces batailles d’usure caractérisent la violence de masse de la guerre."],
      k: "Violence de masse : la guerre tue en très grand nombre, avec des moyens industriels, combattants comme civils." },
    { h: "Une guerre totale",
      p: ["La guerre devient <b>totale</b> : elle mobilise toutes les ressources des pays."],
      tab: { h: ["Mobilisation", "Ce que cela signifie"], r: [["Humaine", "8 millions de Français mobilisés ; des soldats et travailleurs venus des colonies (tirailleurs sénégalais, Indochinois, Maghrébins)."], ["Économique", "les usines produisent des armes et des obus ; l’État dirige l’économie ; emprunts de guerre."], ["Des femmes", "elles remplacent les hommes aux champs et dans les usines (les « munitionnettes »), deviennent infirmières."], ["Des esprits", "propagande, censure de la presse, « bourrage de crâne », union sacrée des partis politiques."]] } },
    { h: "Le génocide des Arméniens",
      p: ["En 1915-1916, le gouvernement de l’<b>Empire ottoman</b>, allié de l’Allemagne, accuse les Arméniens, minorité chrétienne, de soutenir la Russie. Il organise leur extermination : arrestation et exécution des élites (24 avril 1915), massacres des hommes, déportation des femmes, enfants et vieillards dans le désert de Syrie. Entre <b>1,2 et 1,5 million</b> d’Arméniens sont tués.",
          "C’est un <b>génocide</b> : la destruction volontaire et organisée d’un peuple en raison de son appartenance à un groupe. La Turquie actuelle ne le reconnaît toujours pas ; la France l’a reconnu par une loi en 2001."] },
    { h: "1917 : l’année du tournant",
      l: ["Lassitude générale : <b>mutineries</b> dans l’armée française après l’échec de l’offensive du Chemin des Dames (avril 1917) ; grèves à l’arrière.", "Les <b>États-Unis</b> entrent en guerre aux côtés de l’Entente (avril 1917), notamment à cause de la guerre sous-marine allemande.", "En Russie, deux révolutions renversent le tsar puis portent les <b>bolcheviks de Lénine</b> au pouvoir (octobre 1917). La Russie signe la paix avec l’Allemagne en mars 1918."] },
    { h: "La fin de la guerre et les traités de paix",
      p: ["Au printemps 1918, l’Allemagne lance de grandes offensives, puis recule face aux Alliés renforcés par les Américains. L’<b>armistice</b> est signé le <b>11 novembre 1918</b> à Rethondes.",
          "Bilan : environ <b>10 millions de soldats</b> tués (1,4 million de Français), des millions de blessés et de « gueules cassées », des régions dévastées. Les empires allemand, austro-hongrois, ottoman et russe disparaissent ; de nouveaux États naissent (Pologne, Tchécoslovaquie, Yougoslavie).",
          "Le <b>traité de Versailles</b> (28 juin 1919) déclare l’Allemagne responsable de la guerre : elle perd l’Alsace-Moselle et ses colonies, doit payer de lourdes <b>réparations</b>, son armée est limitée. Les Allemands le vivent comme un « diktat », ce qui nourrira l’esprit de revanche. La <b>Société des Nations</b> (SDN) est créée pour préserver la paix."],
      dg: { type: "timeline", title: "Chronologie détaillée", items: [
        { d: "28 juin 1914", t: "Attentat de Sarajevo" }, { d: "3 août 1914", t: "L’Allemagne déclare la guerre à la France" }, { d: "Sept. 1914", t: "Bataille de la Marne" }, { d: "Avril 1915", t: "Début du génocide des Arméniens ; premiers gaz" }, { d: "Févr.-déc. 1916", t: "Bataille de Verdun" }, { d: "Juillet-nov. 1916", t: "Bataille de la Somme" }, { d: "Avril 1917", t: "Entrée en guerre des États-Unis ; mutineries" }, { d: "Oct. 1917", t: "Révolution bolchevique en Russie" }, { d: "11 nov. 1918", t: "Armistice" }, { d: "28 juin 1919", t: "Traité de Versailles" }
      ] },
      k: "Au brevet : sache expliquer en quelques lignes pourquoi la Première Guerre mondiale est une guerre totale et une guerre de violence de masse, avec des exemples précis (Verdun, génocide arménien)." }
  ]
};

      ex: { q: "Un triangle d’aire 6 cm² a pour image un triangle par une homothétie de rapport −3. Quelle est l’aire de l’image ?", s: ["Les longueurs sont multipliées par |−3| = 3.", "Les aires sont multipliées par 3² = 9.", "Aire de l’image = 6 × 9 = 54 cm². Le signe négatif ne change que la position, pas la taille."] } },

function bez(p0, p1, p2, p3, t) { var m = 1 - t; return [m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0], m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1]]; }
function taper(p0, p1, p2, p3, w0, w1) {
  var L = [], R = [], N = 26;
  for (var k = 0; k <= N; k++) {
    var t = k / N, a = bez(p0, p1, p2, p3, Math.max(0, t - 0.01)), b = bez(p0, p1, p2, p3, Math.min(1, t + 0.01)), p = bez(p0, p1, p2, p3, t);
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, w = (w0 + (w1 - w0) * Math.pow(t, 0.8)) / 2;
    L.push([p[0] - dy / len * w, p[1] + dx / len * w]); R.push([p[0] + dy / len * w, p[1] - dx / len * w]);
  }
  var pts = L.concat(R.reverse());
  return "M" + pts.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L") + "Z";
}
function mountMap(root, c) {
  var M = MAPS[c.id];
  if (!M) { root.innerHTML = '<div class="empty"><b>Carte mentale en préparation.</b></div>'; return; }
  var icons = MM_ICONS[c.id] || [], st = { closed: {}, game: false, hidden: {}, sel: null, found: {}, errors: 0, opts: [], z: null, img: null };
  function leaves() { var a = []; M.b.forEach(function (br, i) { br[1].forEach(function (l, j) { a.push({ i: i, j: j, t: l }); }); }); return a; }
  function startGame() {
    var all = shuffle(leaves()), n = Math.max(4, Math.min(8, Math.round(all.length * 0.35)));
    st.game = true; st.hidden = {}; st.found = {}; st.errors = 0; st.sel = null; st.closed = {};
    all.slice(0, n).forEach(function (x) { st.hidden[x.i + "-" + x.j] = x.t; });
    st.opts = shuffle(all.slice(0, n).map(function (x) { return x.t; }));
    draw();
  }
  function svg() {
    var rowH = 40, gap = 36, out = [], defs = [];
    var right = [], left = [];
    M.b.forEach(function (b, i) { (i < Math.ceil(M.b.length / 2) ? right : left).push(i); });
    function blockH(i) { return (st.closed[i] ? 1 : Math.max(1, M.b[i][1].length)) * rowH; }
    function sideH(ids) { return ids.reduce(function (a, i) { return a + blockH(i) + gap; }, -gap); }
    function labW(i) { return tw(M.b[i][0], 17, true) + 34; }
    function leafW(i) { return M.b[i][1].reduce(function (m, l) { return Math.max(m, tw(l, 14) + 14); }, 60); }
    var reach = M.b.reduce(function (m, b, i) { return Math.max(m, 250 + labW(i) + 70 + (st.closed[i] ? 0 : leafW(i)) + 30); }, 520);
    var W = Math.round(reach * 2), cx = W / 2, H = Math.max(sideH(right), sideH(left), 260) + 170, cy = H / 2 - 10;
    [[right, 1], [left, -1]].forEach(function (side) {
      var ids = side[0], dir = side[1], yy = cy - sideH(ids) / 2;
      ids.forEach(function (i) {
        var br = M.b[i], color = MM_COLORS[i % MM_COLORS.length], open = !st.closed[i], bh = blockH(i), by = yy + bh / 2;
        var S = [cx + dir * 60, cy + (by - cy) * 0.18], E = [cx + dir * 250, by];
        out.push('<path class="mm-trunk" fill="' + color + '" d="' + taper(S, [cx + dir * 140, cy + (by - cy) * 0.1], [cx + dir * 165, by + (by > cy ? -18 : 18)], E, 26, 7) + '"/>');
        var lw = labW(i), lx2 = E[0] + dir * lw;
        out.push('<g class="mm-br" data-b="' + i + '"><path d="M' + E[0] + ' ' + by + ' L' + lx2 + ' ' + by + '" stroke="' + color + '" stroke-width="7" stroke-linecap="round"/>' +
          '<rect x="' + Math.min(E[0], lx2) + '" y="' + (by - 34) + '" width="' + lw + '" height="40" fill="transparent"/>' +
          '<text class="mm-bt" x="' + (E[0] + dir * 6) + '" y="' + (by - 11) + '" text-anchor="' + (dir > 0 ? "start" : "end") + '" fill="' + color + '">' + esc(br[0]) + '</text>' +
          '<circle cx="' + (lx2 + dir * 4) + '" cy="' + by + '" r="11" fill="' + color + '"/><text class="mm-tg" x="' + (lx2 + dir * 4) + '" y="' + (by + 5) + '" text-anchor="middle">' + (open ? "−" : "+") + '</text></g>');
        if (icons[i]) out.push('<text class="mm-ico" x="' + (E[0] - dir * 6) + '" y="' + (by - 14) + '" text-anchor="' + (dir > 0 ? "end" : "start") + '">' + icons[i] + '</text>');
        if (open) {
          var T = [lx2 + dir * 18, by];
          br[1].forEach(function (l, j) {
            var ly = yy + j * rowH + rowH / 2 + 6, k = i + "-" + j, hid = st.hidden[k] && !st.found[k], lab = hid ? "?" : l, w = hid ? 70 : tw(l, 14) + 14;
            var P = [T[0] + dir * 58, ly];
            out.push('<path fill="' + color + '" opacity=".75" d="' + taper(T, [T[0] + dir * 28, by], [T[0] + dir * 24, ly], P, 6, 2.2) + '"/>');
            var x2 = P[0] + dir * w, cls = st.hidden[k] ? (st.found[k] ? "mm-lf mm-ok" : "mm-lf mm-q" + (st.sel === k ? " mm-sel" : "")) : "mm-lf";
            out.push('<g class="' + cls + '" data-l="' + k + '" style="--c:' + color + '">' +
              (hid ? '<rect x="' + Math.min(P[0], x2) + '" y="' + (ly - 26) + '" width="' + w + '" height="30" rx="9"/>' : "") +
              '<path d="M' + P[0] + ' ' + ly + ' L' + x2 + ' ' + ly + '" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round"/>' +
              '<text x="' + (hid ? (P[0] + x2) / 2 : P[0] + dir * 7) + '" y="' + (ly - 7) + '" text-anchor="' + (hid ? "middle" : dir > 0 ? "start" : "end") + '">' + esc(lab) + '</text></g>');
          });
        }
        yy += bh + gap;
      });
    });
    var R = 70;
    defs.push('<clipPath id="mmclip-' + c.id + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 5) + '"/></clipPath>');
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" class="mm-c-bg" style="stroke:' + col(c.sub) + '"/>');
    if (st.img) out.push('<image href="' + esc(st.img) + '" x="' + (cx - R) + '" y="' + (cy - R) + '" width="' + 2 * R + '" height="' + 2 * R + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#mmclip-' + c.id + ')"/>');
    else out.push('<text class="mm-c-ico" x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle">' + (icons[0] || "★") + '</text>');
    var tW = tw(M.c, 20, true) + 36;
    out.push('<rect x="' + (cx - tW / 2) + '" y="' + (cy + R - 14) + '" width="' + tW + '" height="40" rx="20" style="fill:' + col(c.sub) + '"/><text class="mm-ct" x="' + cx + '" y="' + (cy + R + 13) + '" text-anchor="middle">' + esc(M.c) + '</text>');
    return { w: W, h: H, s: '<svg class="mm-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Carte mentale : ' + esc(M.c) + '"><defs>' + defs.join("") + '</defs>' + out.join("") + '</svg>' };
  }
  function draw() {
    var total = Object.keys(st.hidden).length, done = Object.keys(st.found).length, g = svg(), narrow = root.clientWidth < 700;
    var fit = Math.min(1, (root.clientWidth - 4) / g.w);
    if (st.z === null) st.z = fit;
    var keepX = root.querySelector(".mm-wrap") ? root.querySelector(".mm-wrap").scrollLeft : null;
    root.innerHTML = '<div class="mm-bar">' + (st.game
      ? '<span class="mm-score">' + done + ' / ' + total + ' trouvées' + (st.errors ? ' · ' + st.errors + ' erreur' + (st.errors > 1 ? "s" : "") : "") + '</span><button type="button" class="btn" data-mm="quit">Quitter le jeu</button>'
      : '<button type="button" class="btn btn-sub" data-mm="game">Jouer : complète la carte</button><button type="button" class="link" data-mm="open">Tout déplier</button><button type="button" class="link" data-mm="close">Tout replier</button>') +
      '<span class="mm-zoom"><button type="button" data-mm="zout" aria-label="Dézoomer">−</button><button type="button" data-mm="zin" aria-label="Zoomer">+</button></span></div>' +
      '<p class="mm-help">' + (st.game ? (done === total ? "" : st.sel ? "Choisis la bonne réponse ci-dessous." : "Touche une case « ? », puis la bonne réponse.") : (narrow ? (st.z <= fit + 0.01 ? "Vue d’ensemble : touche + pour zoomer et lire, puis fais glisser." : "Fais glisser pour explorer · − pour revoir toute la carte.") : "Touche une branche pour la replier ou la déplier.")) + '</p>' +
      '<div class="mm-wrap"><div class="mm-in" style="width:' + Math.round(g.w * st.z) + 'px">' + g.s + '</div></div>' +
      (st.game ? (done === total
        ? '<div class="mm-end"><b>Bravo, carte complétée !</b><span>' + (st.errors ? st.errors + " erreur" + (st.errors > 1 ? "s" : "") + " en chemin." : "Sans aucune erreur.") + '</span><button type="button" class="btn btn-sub" data-mm="game">Rejouer avec d’autres cases</button></div>'
        : '<div class="mm-opts">' + st.opts.map(function (o, k) { return '<button type="button" class="chip" data-opt="' + k + '">' + esc(o) + '</button>'; }).join("") + '</div>') : "");
    var wrap = root.querySelector(".mm-wrap");
    wrap.scrollLeft = keepX !== null ? keepX : Math.max(0, (g.w * st.z - wrap.clientWidth) / 2);
  }
  root.onclick = function (e) {
    var b = e.target.closest("[data-mm]");
    if (b) {
      var a = b.dataset.mm, wrap = root.querySelector(".mm-wrap"), mid = wrap ? (wrap.scrollLeft + wrap.clientWidth / 2) / (wrap.scrollWidth || 1) : 0.5;
      if (a === "game") startGame();
      else if (a === "quit") { st.game = false; st.hidden = {}; draw(); }
      else if (a === "open") { st.closed = {}; draw(); }
      else if (a === "close") { M.b.forEach(function (x, i) { st.closed[i] = true; }); draw(); }
      else if (a === "zin" || a === "zout") { var fitZ = Math.min(1, (root.clientWidth - 4) / (root.querySelector('.mm-svg').viewBox.baseVal.width || 1000)); st.z = Math.max(fitZ, Math.min(1.6, st.z * (a === "zin" ? 1.5 : 1 / 1.5))); draw(); var w2 = root.querySelector(".mm-wrap"); w2.scrollLeft = mid * w2.scrollWidth - w2.clientWidth / 2; w2.scrollTop = (w2.scrollHeight - w2.clientHeight) / 2; }
      return;
    }
    var br = e.target.closest(".mm-br"); if (br && !st.game) { var i = +br.dataset.b; st.closed[i] = !st.closed[i]; draw(); return; }
    var lf = e.target.closest(".mm-q"); if (lf && st.game) { st.sel = lf.dataset.l; draw(); return; }
    var op = e.target.closest("[data-opt]");
    if (op && st.game) {
      if (!st.sel) st.sel = Object.keys(st.hidden).filter(function (k) { return !st.found[k]; })[0];
      var txt = st.opts[+op.dataset.opt];
      if (st.hidden[st.sel] === txt) { st.found[st.sel] = true; st.opts.splice(+op.dataset.opt, 1); st.sel = null; draw(); }
      else { st.errors++; op.classList.add("mm-bad"); var sc = root.querySelector(".mm-score"); if (sc) sc.textContent = Object.keys(st.found).length + " / " + Object.keys(st.hidden).length + " trouvées · " + st.errors + " erreur" + (st.errors > 1 ? "s" : ""); setTimeout(function () { op.classList.remove("mm-bad"); }, 500); }
    }
  };
  draw();
  if (COVERS[c.id]) wkFetch(COVERS[c.id]).then(function (d) { var im = wkImg(d); if (im && document.body.contains(root)) { st.img = im; draw(); } });
}

/* ---------- routeur ---------- */
function setNav(k) {
  Array.prototype.forEach.call(document.querySelectorAll(".nav a, .tabbar a"), function (a) { a.classList.toggle("on", a.dataset.nav === k); });
}
function route() {
  keyFn = null;
  var h = decodeURIComponent(location.hash.slice(1)), parts = h.split("-");
  app.style.setProperty("--sub", "var(--fg)");
  if (S[h]) {
    app.style.setProperty("--sub", col(h)); app.innerHTML = viewSubject(S[h]); setNav("home");
    document.title = S[h].name + " · Objectif Brevet";
  } else if (CHI[h]) {
    var c = CHI[h]; store.set("last", c.id);
    app.style.setProperty("--sub", col(c.sub)); app.innerHTML = viewChapter(c); setNav("home");
    document.title = c.title + " · Objectif Brevet";
    var go = window.__goto; window.__goto = null;
    var cur = go ? go.tab : "resume";
    app.querySelector(".tabs").onclick = function (e) { var b = e.target.closest("[data-tab]"); if (b) { cur = b.dataset.tab; drawPanel(c, cur); } };
    document.getElementById("panel").addEventListener("click", function (e) {
      var g = e.target.closest("[data-goto]"); if (g) { cur = g.dataset.goto; drawPanel(c, cur); var t = document.querySelector(".tabs-wrap"); if (t) window.scrollTo({ top: t.offsetTop - 70, behavior: "smooth" }); return; }
      var sc = e.target.closest("[data-scroll]"); if (sc) { e.preventDefault(); var el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: "smooth" }); }
    });
    drawPanel(c, cur);
    loadCover(c);
    if (go && go.sec != null) setTimeout(function () { var el = document.getElementById("cs" + go.sec); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); el.parentNode.classList.add("cs-hit"); } }, 120);
  } else if (parts[0] === "flashcards") {
    var fch = CHI[parts.slice(1).join("-")] || null;
    var f = fch ? fch.sub : S[parts[1]] ? parts[1] : "all";
    if (f !== "all") app.style.setProperty("--sub", col(f));
    app.innerHTML = viewDeck(f, fch && fch.id); setNav("flashcards"); document.title = "Flashcards · Objectif Brevet";
    var pool = fch ? cardsOf(fch) : flat(f === "all" ? CH : B[f], cardsOf);
    var box = document.getElementById("only-review");
    var start = function () { var l = box.checked ? pool.filter(function (x) { return known[x.id] !== 1; }) : pool; mountDeck(document.getElementById("deck"), shuffle(l), { empty: "Bravo, toutes les cartes de cette sélection sont sues." }); };
    box.onchange = start; start();
  } else if (parts[0] === "quiz") {
    if (parts[1] === "erreurs") { qmode = "err"; store.set("qmode", qmode); }
    var qch = CHI[parts.slice(1).join("-")] || null;
    var fq = qch ? qch.sub : S[parts[1]] ? parts[1] : "all";
    if (fq !== "all") app.style.setProperty("--sub", col(fq));
    app.innerHTML = viewQuiz(fq, qch && qch.id); setNav("quiz"); document.title = "Quiz · Objectif Brevet";
    var qpool = qch ? quizOf(qch) : flat(fq === "all" ? CH : B[fq], quizOf);
    var seg = document.getElementById("qmodes");
    var run = function () {
      Array.prototype.forEach.call(seg.children, function (b) { var on = b.dataset.mode === qmode; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
      var errs = qpool.filter(function (q) { return missed[q.id]; });
      document.getElementById("nerr").textContent = errs.length ? errs.length : "";
      var p = qmode === "vf" ? qpool.filter(function (q) { return isTF(q.opts); }) : qmode === "err" ? errs : qpool;
      var n = qmode === "20" ? 20 : qmode === "err" ? p.length : 10;
      mountQuiz(document.getElementById("quiz"), pickFresh(p, n), {
        mixed: true, restart: run,
        restartLabel: qmode === "err" ? "Revoir mes erreurs" : "Nouvelle série",
        emptyTitle: qmode === "err" ? "Aucune erreur en attente." : "Aucune question ici.",
        empty: qmode === "err" ? "Les questions ratées dans les quiz apparaîtront ici jusqu’à ce que tu y répondes juste." : "Change de matière."
      });
    };
    seg.onclick = function (e) { var b = e.target.closest("[data-mode]"); if (!b) return; qmode = b.dataset.mode; store.set("qmode", qmode); run(); };
    run();
  } else if (parts[0] === "carnet") {
    app.innerHTML = viewCarnet(); setNav(""); document.title = "Mon carnet · Objectif Brevet";
    bindCarnet(parts[1] === "revision");
  } else if (h === "examen") {
    app.innerHTML = viewExam(); setNav("examen"); document.title = "L’examen · Objectif Brevet";
  } else {
    app.innerHTML = viewHome(); setNav("home"); document.title = "Objectif Brevet";
  }
  window.scrollTo(0, 0);
  Array.prototype.forEach.call(document.querySelectorAll(".chips"), function (row) {
    var on = row.querySelector(".chip.on");
    if (on) row.scrollLeft = on.offsetLeft - row.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  });
}

document.getElementById("strip").innerHTML = SUBJECTS.map(function (s) { return '<a href="#' + s.id + '" style="background:' + col(s.id) + '" aria-label="' + s.name + '"></a>'; }).join("");
document.getElementById("logo-dots").innerHTML = SUBJECTS.map(function (s) { return '<i style="background:' + col(s.id) + '"></i>'; }).join("");
window.addEventListener("hashchange", route);
if (USER) { document.getElementById("btn-user").textContent = USER.name.charAt(0).toUpperCase(); route(); }
else showLogin();
})();
